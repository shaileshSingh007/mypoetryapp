<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Poetries</title>
  <meta name="theme-color" content="#0d0d0f">
  <!-- Typography & FontAwesome 4.7 Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Noto+Serif+Devanagari:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #151519;
      --surface-hover: #1c1c22;
      --tx: #edeae4;
      --mu: #78756f;
      --g: #d4af37;
      --g-dim: rgba(212, 175, 55, 0.14);
      --bd: #222228;
      --danger: #e05246;
      --ok: #50b878;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.55 'Cormorant Garamond', 'Noto Serif Devanagari', Georgia, serif;
      padding: env(safe-area-inset-top) 0 0;
      overflow-x: hidden;
    }

    /* Ultra-narrow mobile container */
    #app {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: calc(74px + env(safe-area-inset-bottom));
    }

    /* Minimalistic Top Header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(13, 13, 15, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--bd);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      gap: 8px;
    }

    .brand {
      font-size: 1.45em;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: var(--tx);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-title {
      font-size: 1.15em;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin: 0 4px;
      color: var(--tx);
    }

    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    main {
      padding: 12px 14px;
    }

    /* Icon-only Minimalist Buttons */
    button {
      font: inherit;
      color: var(--tx);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.16s ease;
      padding: 0;
      flex-shrink: 0;
    }

    button:active {
      transform: scale(0.92);
    }

    .btn-surface {
      background: var(--surface);
      border-color: var(--bd);
    }

    .btn-gold {
      background: var(--g);
      color: #0d0d0f;
      border-color: var(--g);
    }

    .btn-active {
      color: var(--g);
      background: var(--g-dim);
      border-color: rgba(212, 175, 55, 0.3);
    }

    .btn-danger {
      color: var(--danger);
    }

    /* Search & Filter Bar */
    .search-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
    }

    .search-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mu);
      font-size: 0.9em;
      pointer-events: none;
    }

    input, select, textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 11px;
      color: var(--tx);
      padding: 9px 12px;
      font: 14px/1.4 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--g);
    }

    .search-wrap input {
      padding-left: 34px;
      height: 38px;
    }

    /* Status Filter Pills (All / Incomplete / Complete) */
    .filter-Drawer {
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .icon-tabs {
      display: flex;
      gap: 6px;
      background: var(--bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--bd);
    }

    .icon-tabs button {
      flex: 1;
      height: 32px;
      width: auto;
      border-radius: 7px;
      color: var(--mu);
      font-size: 0.92em;
    }

    .icon-tabs button.on {
      background: var(--surface-hover);
      color: var(--g);
      border-color: var(--bd);
    }

    /* Minimalistic Poetry List */
    .poem-list {
      display: flex;
      flex-direction: column;
    }

    .poem-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 6px;
      border-bottom: 1px solid var(--bd);
      cursor: pointer;
      gap: 12px;
      transition: background 0.15s;
    }

    .poem-item:first-child {
      border-top: 1px solid var(--bd);
    }

    .poem-item:active {
      background: var(--surface);
    }

    .poem-main {
      min-width: 0;
      flex: 1;
    }

    .poem-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .poem-title {
      font-size: 1.18em;
      font-weight: 600;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .poem-snippet {
      margin: 2px 0 0;
      color: var(--mu);
      font-size: 0.95em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Noto Serif Devanagari', 'Cormorant Garamond', serif;
    }

    .poem-meta-icons {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      font-size: 0.85em;
      color: var(--mu);
    }

    .status-dot {
      font-size: 0.95em;
    }

    .status-complete {
      color: var(--ok);
    }

    .status-incomplete {
      color: var(--g);
    }

    /* Reader View */
    #rd {
      white-space: pre-wrap;
      font-family: 'Noto Serif Devanagari', 'Cormorant Garamond', Georgia, serif;
      padding: 12px 4px 28px;
      color: var(--tx);
      word-break: break-word;
    }

    .reader-footer-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 6px;
      border-top: 1px solid var(--bd);
      margin-top: 16px;
    }

    /* Editor View */
    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .edit-title-input {
      font-family: 'Cormorant Garamond', 'Noto Serif Devanagari', serif;
      font-size: 1.3em;
      font-weight: 600;
      padding: 10px 12px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    textarea#eb {
      min-height: 54vh;
      line-height: 1.85;
      font-size: 1.15em;
      font-family: 'Noto Serif Devanagari', 'Cormorant Garamond', Georgia, serif;
      resize: none;
      padding: 14px;
    }

    /* Category & Tag Grid */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .cat-card {
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .cat-name {
      font-weight: 600;
      font-size: 1.08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-family: 'Inter', sans-serif;
      font-size: 0.75em;
      color: var(--g);
      background: var(--g-dim);
      padding: 2px 8px;
      border-radius: 99px;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 99px;
      padding: 4px 11px;
      font-size: 0.85em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--mu);
    }

    /* Settings Stats Grid (Icon + Number only) */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .stat-box i {
      color: var(--g);
      font-size: 1.1em;
    }

    .stat-num {
      font-family: 'Inter', sans-serif;
      font-size: 1.15em;
      font-weight: 500;
    }

    /* Floating Action Button (+ Bottom Right) */
    #fab {
      position: fixed;
      right: max(18px, calc(50% - 212px));
      bottom: calc(68px + env(safe-area-inset-bottom));
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--g);
      color: #0d0d0f;
      border: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
      font-size: 1.3em;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bottom Navigation Bar (Icon Only) */
    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      background: rgba(18, 18, 22, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--bd);
      display: flex;
      justify-content: space-around;
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
      z-index: 25;
    }

    nav button {
      flex: 1;
      height: 42px;
      border: none;
      border-radius: 0;
      color: var(--mu);
      font-size: 1.15em;
    }

    nav button.on {
      color: var(--g);
    }

    /* Custom Minimal Modal (Replaces native confirm/alert) */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 280px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .modal-icon {
      font-size: 2em;
      color: var(--danger);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    .modal-actions button {
      flex: 1;
      height: 42px;
    }

    /* Toast & Top Loader */
    #ld {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--g);
      width: 0;
      transition: width 0.25s;
      z-index: 100;
    }

    #toast {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-hover);
      color: var(--g);
      border: 1px solid var(--bd);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      z-index: 95;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }

    #login {
      min-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 20px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--mu);
      font-size: 1.5em;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- ===== CONFIG ===== -->
  <script>
    const CFG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbwJ4xfSRODpCXLESv6_wiL3QHrbyLvR0xR72GAsi7KcCEtEdf4ZU5gw_rBfkzgEJEOVLA/exec',
      DEPLOYMENT_ID: 'AKfycbwJ4xfSRODpCXLESv6_wiL3QHrbyLvR0xR72GAsi7KcCEtEdf4ZU5gw_rBfkzgEJEOVLA',
      CLIENT_ID: '836215858083-gm17ivcj7bd52tu4nev3hmfa0o7vnk38.apps.googleusercontent.com',
      EMAIL: 'shailesh.r.c.singh@gmail.com'
    };
  </script>

  <div id="ld"></div>
  <div id="toast"><i class="fa fa-check"></i></div>

  <!-- Custom Icon Confirmation Modal -->
  <div id="modal-overlay" class="hide">
    <div class="modal-box">
      <i id="modal-ico" class="fa fa-exclamation-triangle modal-icon"></i>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-surface"><i class="fa fa-times"></i></button>
        <button id="modal-ok" class="btn-gold"><i class="fa fa-check"></i></button>
      </div>
    </div>
  </div>

  <!-- Login Screen -->
  <div id="login" class="hide">
    <h1 class="brand" style="font-size:2.1em">Poetries</h1>
    <div id="gb"></div>
    <div id="lerr" style="color:var(--danger);font-size:1.2em"></div>
  </div>

  <!-- Main Narrow App Shell -->
  <div id="app" class="hide">
    <header id="hdr"></header>
    <main id="m"></main>
    <button id="fab" data-go="edit" aria-label="Add Poetry"><i class="fa fa-plus"></i></button>
    <nav id="nv"></nav>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const LS = {
      g: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
      s: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
    };

    const S = {
      items: [],
      view: 'all',
      id: null,
      page: 1,
      fp: false,
      f: LS.g('flt', { q: '', cat: '', lang: '', status: '', fav: '', tag: '', sort: 'new' }),
      dirty: false
    };

    let TOKEN = LS.g('tok', ''), busy = false, modalCb = null;

    // Normalize Status helper ('Incomplete' vs 'Complete', backward compatible with Draft/Published)
    function isComplete(status) {
      const s = String(status || '').toLowerCase();
      return s === 'complete' || s === 'published';
    }

    // Minimal Icon Toast
    function toast(iconClass = 'fa-check', err = false) {
      const e = $('#toast');
      e.innerHTML = `<i class="fa ${iconClass}"></i>`;
      e.style.color = err ? 'var(--danger)' : 'var(--g)';
      e.style.display = 'flex';
      setTimeout(() => e.style.display = 'none', 1800);
    }

    // Custom non-blocking modal dialog
    function askModal(icon, onConfirm) {
      $('#modal-ico').className = `fa ${icon} modal-icon`;
      $('#modal-overlay').classList.remove('hide');
      modalCb = onConfirm;
    }

    $('#modal-cancel').onclick = () => { $('#modal-overlay').classList.add('hide'); modalCb = null; };
    $('#modal-ok').onclick = () => {
      $('#modal-overlay').classList.add('hide');
      if (modalCb) { const fn = modalCb; modalCb = null; fn(); }
    };

    function jwt(t) {
      try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))) }
      catch { return null }
    }

    // ---- Auth ----
    function showLogin(errIcon) {
      $('#app').classList.add('hide');
      $('#login').classList.remove('hide');
      $('#lerr').innerHTML = errIcon ? `<i class="fa ${errIcon}"></i>` : '';
    }

    function onCred(r) {
      const p = jwt(r.credential);
      if (!p || String(p.email).toLowerCase() !== CFG.EMAIL.toLowerCase() || !p.email_verified) {
        return showLogin('fa-ban');
      }
      TOKEN = r.credential;
      LS.s('tok', TOKEN);
      start();
    }

    function logout() {
      TOKEN = '';
      localStorage.removeItem('tok');
      localStorage.removeItem('pc');
      S.items = [];
      if (window.google?.accounts?.id) google.accounts.id.disableAutoSelect();
      showLogin();
    }

    function initG() {
      if (!window.google || !google.accounts) return setTimeout(initG, 300);
      google.accounts.id.initialize({ client_id: CFG.CLIENT_ID, callback: onCred, auto_select: true });
      google.accounts.id.renderButton($('#gb'), { theme: 'filled_black', size: 'large', text: 'continue_with', shape: 'pill' });
      const p = jwt(TOKEN);
      if (p && p.exp * 1000 > Date.now() + 6e4) start();
      else { showLogin(); google.accounts.id.prompt(); }
    }

    // ---- API Service ----
    async function api(action, data) {
      $('#ld').style.width = '75%';
      try {
        const r = await fetch(CFG.API_URL, {
          method: 'POST',
          redirect: 'follow',
          credentials: 'omit',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ token: TOKEN, action, data })
        });
        const j = await r.json();
        if (!j.ok) {
          if (j.error === 'auth') {
            logout();
            showLogin('fa-lock');
            throw 0;
          }
          throw new Error(j.error);
        }
        return j;
      } catch (e) {
        if (e === 0) throw e;
        throw new Error('fa-wifi');
      } finally {
        $('#ld').style.width = '100%';
        setTimeout(() => $('#ld').style.width = '0', 260);
      }
    }

    const getAllPoetries = async () => { const j = await api('list'); S.items = j.data; LS.s('pc', j.data); };
    const addPoetry = d => api('add', d);
    const updatePoetry = (id, d) => api('update', { ...d, id });
    const deletePoetry = id => api('delete', { id });
    const updateFavorite = (id, value) => api('favorite', { id, value });

    async function start() {
      $('#login').classList.add('hide');
      $('#app').classList.remove('hide');
      S.items = LS.g('pc', []);
      go('all');
      try { await getAllPoetries(); }
      catch (e) { if (e) toast('fa-cloud-download', true); }
      R();
    }

    // ---- Helpers ----
    const byId = id => S.items.find(p => p.ID === id);
    const tags = p => String(p.Tags || '').split(',').map(x => x.trim()).filter(Boolean);
    const cats = () => [...new Set(S.items.map(p => p.Category).filter(Boolean))].sort();

    function list(favOnly, catOnly) {
      const f = S.f, q = f.q.toLowerCase();
      let a = S.items.filter(p => {
        const comp = isComplete(p.Status);
        const matchStatus = !f.status || (f.status === 'Complete' ? comp : !comp);
        return (!favOnly || p.Favorite) &&
          (!catOnly || p.Category === catOnly) &&
          (!q || [p.Title, p.Content, p.Category, p.Tags, p.Language].join(' ').toLowerCase().includes(q)) &&
          (!f.cat || p.Category === f.cat) &&
          (!f.lang || p.Language === f.lang) &&
          matchStatus &&
          (!f.tag || tags(p).includes(f.tag));
      });
      const s = {
        new: (x, y) => y.CreatedAt > x.CreatedAt ? 1 : -1,
        old: (x, y) => x.CreatedAt > y.CreatedAt ? 1 : -1,
        az: (x, y) => String(x.Title).localeCompare(String(y.Title))
      };
      return a.sort(s[f.sort] || s.new);
    }

    // Minimalistic List Row Item
    const rowItem = p => {
      const comp = isComplete(p.Status);
      const firstLine = String(p.Content || '').split('\n').find(l => l.trim()) || '';
      return `
        <div class="poem-item" data-id="${E(p.ID)}">
          <div class="poem-main">
            <div class="poem-title-row">
              <span class="poem-title">${E(p.Title)}</span>
            </div>
            <p class="poem-snippet">${E(firstLine)}</p>
          </div>
          <div class="poem-meta-icons">
            ${p.Favorite ? '<i class="fa fa-star" style="color:var(--g)"></i>' : ''}
            <i class="fa ${comp ? 'fa-check-circle status-complete' : 'fa-clock-o status-incomplete'} status-dot"></i>
          </div>
        </div>`;
    };

    function dl(name, text, type) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type }));
      a.download = name;
      a.click();
    }

    function txt(p) { return p.Title + '\n\n' + p.Content; }
    const csv = () => {
      const H = ['ID', 'Title', 'Category', 'Language', 'Content', 'Tags', 'CreatedAt', 'UpdatedAt', 'Favorite', 'Status'];
      return H.join(',') + '\n' + S.items.map(p => H.map(k => '"' + String(p[k] ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
    };

    // ---- Navigation & Header Rendering ----
    function renderHeader() {
      const h = $('#hdr');
      const fab = $('#fab');
      // Show floating + button on browse views
      if (['all', 'favs', 'cats'].includes(S.view)) fab.classList.remove('hide');
      else fab.classList.add('hide');

      if (S.view === 'read') {
        const p = byId(S.id);
        if (!p) {
          h.innerHTML = `<button data-go="all"><i class="fa fa-arrow-left"></i></button><div class="top-title"></div>`;
          return;
        }
        h.innerHTML = `
          <button data-go="all"><i class="fa fa-arrow-left"></i></button>
          <div class="top-title">${E(p.Title)}</div>
          <div class="hdr-actions">
            <button id="z-dec"><i class="fa fa-minus"></i></button>
            <button id="z-inc"><i class="fa fa-plus"></i></button>
            <button id="fv" class="${p.Favorite ? 'btn-active' : ''}"><i class="fa ${p.Favorite ? 'fa-star' : 'fa-star-o'}"></i></button>
            <button data-go="edit" data-a="${E(p.ID)}"><i class="fa fa-pencil"></i></button>
          </div>`;
      } else if (S.view === 'edit') {
        const p = S.id ? byId(S.id) : null;
        const backTarget = S.id ? 'read' : 'all';
        h.innerHTML = `
          <button data-go="${backTarget}" data-a="${E(S.id || '')}"><i class="fa fa-times"></i></button>
          <div class="top-title">${p ? E(p.Title) : 'Poetries'}</div>
          <div class="hdr-actions">
            <button id="ef-btn" class="${p?.Favorite ? 'btn-active' : ''}" data-fav="${p?.Favorite ? '1' : '0'}">
              <i class="fa ${p?.Favorite ? 'fa-star' : 'fa-star-o'}"></i>
            </button>
            <button id="save-inc" class="btn-surface" title="Incomplete"><i class="fa fa-clock-o" style="color:var(--g)"></i></button>
            <button id="save-cmp" class="btn-gold" title="Complete"><i class="fa fa-check"></i></button>
          </div>`;
      } else {
        // Default Minimalistic Header: "Poetries"
        h.innerHTML = `
          <h1 class="brand">Poetries</h1>
          <div class="hdr-actions">
            ${S.view === 'cats' && S.id ? `<button data-go="cats"><i class="fa fa-arrow-left"></i></button>` : ''}
            <button id="rnd"><i class="fa fa-random"></i></button>
            <button id="ft" class="${S.fp ? 'btn-active' : ''}"><i class="fa fa-sliders"></i></button>
          </div>`;
      }
    }

    function nav() {
      const tabs = [
        ['all', 'fa-book'],
        ['favs', 'fa-star'],
        ['cats', 'fa-folder-o'],
        ['set', 'fa-cog']
      ];
      $('#nv').innerHTML = tabs.map(([k, ico]) =>
        `<button data-go="${k}" class="${S.view === k ? 'on' : ''}"><i class="fa ${ico}"></i></button>`
      ).join('');
    }

    function go(v, id) {
      if (S.dirty && S.view === 'edit') {
        return askModal('fa-trash-o', () => { S.dirty = false; go(v, id); });
      }
      S.dirty = false;
      S.view = v;
      S.id = id || null;
      S.page = 1;
      R();
      scrollTo(0, 0);
    }

    function R() {
      renderHeader();
      nav();
      const m = $('#m'), V = V_[S.view];
      m.innerHTML = V ? V() : '';
    }

    // ---- Views ----
    const V_ = {
      all() { return page(false); },
      favs() { return page(true); },
      cats() {
        if (S.id) return page(false, S.id);
        const tg = {};
        S.items.forEach(p => tags(p).forEach(t => tg[t] = (tg[t] || 0) + 1));
        const catList = cats();
        return `
          <div class="cat-grid">
            ${catList.map(c => `
              <div class="cat-card" data-go="cats" data-a="${E(c)}">
                <span class="cat-name">${E(c)}</span>
                <span class="badge">${S.items.filter(p => p.Category === c).length}</span>
              </div>
            `).join('') || `<div class="empty-state"><i class="fa fa-folder-open-o"></i></div>`}
          </div>
          <div class="chip-wrap">
            ${Object.keys(tg).map(t => `
              <span class="chip" data-tag="${E(t)}">
                <i class="fa fa-hashtag"></i>${E(t)} <b>${tg[t]}</b>
              </span>
            `).join('')}
          </div>`;
      },
      read() {
        const p = byId(S.id);
        if (!p) return `<div class="empty-state"><i class="fa fa-Chain-broken"></i></div>`;
        const z = LS.g('rs', { s: 20, l: 1.9 });
        const comp = isComplete(p.Status);
        return `
          <div style="display:flex;align-items:center;gap:10px;color:var(--mu);font-size:0.85em;margin-bottom:6px">
            <span><i class="fa ${comp ? 'fa-check-circle status-complete' : 'fa-clock-o status-incomplete'}"></i></span>
            <span>${E(p.Category)}</span>
            <span>·</span>
            <span>${E(p.Language)}</span>
            ${tags(p).length ? `<span>· <i class="fa fa-tags"></i> ${tags(p).map(E).join(', ')}</span>` : ''}
          </div>
          <div id="rd" style="font-size:${z.s}px;line-height:${z.l}">${E(p.Content)}</div>
          <div class="reader-footer-bar">
            <button id="cp" class="btn-surface"><i class="fa fa-clone"></i></button>
            <button id="sh" class="btn-surface"><i class="fa fa-share-alt"></i></button>
            <button id="tx" class="btn-surface"><i class="fa fa-download"></i></button>
            <button id="del" class="btn-surface btn-danger"><i class="fa fa-trash-o"></i></button>
          </div>`;
      },
      edit() {
        const p = S.id ? byId(S.id) : { Title: '', Category: 'Kavita', Language: 'Hindi', Content: '', Tags: '', Status: 'Incomplete', Favorite: false };
        return `
          <div class="edit-form">
            <input id="et" class="edit-title-input" placeholder="..." value="${E(p.Title)}">
            <div class="row-2">
              <input id="ec" list="cl" placeholder="..." value="${E(p.Category)}">
              <datalist id="cl">
                ${[...new Set(['Ghazal', 'Kavita', 'Shayari', 'Nazm', 'Free Verse', ...cats()])].map(c => `<option value="${E(c)}">`).join('')}
              </datalist>
              <select id="el">
                ${['Hindi', 'English', 'Urdu', 'Other'].map(l => `<option ${l == p.Language ? 'selected' : ''}>${l}</option>`).join('')}
              </select>
            </div>
            <textarea id="eb" placeholder="...">${E(p.Content)}</textarea>
            <input id="eg" placeholder="#..." value="${E(p.Tags)}">
          </div>`;
      },
      set() {
        const a = S.items;
        const compCount = a.filter(p => isComplete(p.Status)).length;
        const incCount = a.length - compCount;
        return `
          <div class="stat-grid">
            <div class="stat-box"><i class="fa fa-book"></i><span class="stat-num">${a.length}</span></div>
            <div class="stat-box"><i class="fa fa-star"></i><span class="stat-num">${a.filter(p => p.Favorite).length}</span></div>
            <div class="stat-box"><i class="fa fa-clock-o"></i><span class="stat-num">${incCount}</span></div>
            <div class="stat-box"><i class="fa fa-check-circle"></i><span class="stat-num">${compCount}</span></div>
          </div>
          <div style="display:flex;justify-content:space-around;background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:12px">
            <button id="rf" class="btn-surface"><i class="fa fa-refresh"></i></button>
            <button id="ej" class="btn-surface"><i class="fa fa-code"></i></button>
            <button id="ec2" class="btn-surface"><i class="fa fa-table"></i></button>
            <button id="lo" class="btn-surface btn-danger"><i class="fa fa-sign-out"></i></button>
          </div>`;
      }
    };

    function page(fav, cat) {
      const f = S.f, a = list(fav, cat);
      const hasFilters = f.cat || f.lang || f.status || f.tag || f.q;
      return `
        <div class="search-bar">
          <div class="search-wrap">
            <i class="fa fa-search"></i>
            <input id="sq" type="search" value="${E(f.q)}">
          </div>
          ${hasFilters ? `<button data-x="all" class="btn-surface"><i class="fa fa-times"></i></button>` : ''}
        </div>

        <div class="filter-Drawer ${S.fp ? '' : 'hide'}">
          <!-- Status Filter: All | Incomplete | Complete -->
          <div class="icon-tabs">
            <button data-st="" class="${!f.status ? 'on' : ''}"><i class="fa fa-list-ul"></i></button>
            <button data-st="Incomplete" class="${f.status === 'Incomplete' ? 'on' : ''}"><i class="fa fa-clock-o"></i></button>
            <button data-st="Complete" class="${f.status === 'Complete' ? 'on' : ''}"><i class="fa fa-check-circle"></i></button>
          </div>
          <!-- Sort Order: Newest | Oldest | A-Z -->
          <div class="icon-tabs">
            <button data-so="new" class="${f.sort === 'new' ? 'on' : ''}"><i class="fa fa-sort-numeric-desc"></i></button>
            <button data-so="old" class="${f.sort === 'old' ? 'on' : ''}"><i class="fa fa-sort-numeric-asc"></i></button>
            <button data-so="az" class="${f.sort === 'az' ? 'on' : ''}"><i class="fa fa-sort-alpha-asc"></i></button>
          </div>
          <div class="row-2">
            <select id="fc">
              <option value="">*</option>
              ${cats().map(o => `<option ${o == f.cat ? 'selected' : ''}>${E(o)}</option>`).join('')}
            </select>
            <select id="fl">
              <option value="">*</option>
              ${['Hindi', 'English', 'Urdu', 'Other'].map(o => `<option ${o == f.lang ? 'selected' : ''}>${E(o)}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="poem-list">
          ${a.slice(0, S.page * 35).map(rowItem).join('') || `<div class="empty-state"><i class="fa fa-feather"></i><i class="fa fa-circle-o"></i></div>`}
        </div>
        ${a.length > S.page * 35 ? `<div style="text-align:center;margin-top:14px"><button id="more" class="btn-surface" style="width:100%"><i class="fa fa-angle-down"></i></button></div>` : ''}`;
    }

    // ---- Actions ----
    async function run(fn, icon = 'fa-check') {
      if (busy) return;
      busy = true;
      try {
        await fn();
        await getAllPoetries();
        toast(icon);
        return true;
      } catch (e) {
        if (e) toast('fa-exclamation-circle', true);
        return false;
      } finally {
        busy = false;
      }
    }

    async function save(status) {
      const t = $('#et').value.trim(), c = $('#eb').value;
      if (!t || !c.trim()) return toast('fa-exclamation', true);
      const favBtn = $('#ef-btn');
      const isFav = favBtn && favBtn.dataset.fav === '1';
      const d = {
        Title: t,
        Category: $('#ec').value || 'Other',
        Language: $('#el').value,
        Content: c,
        Tags: $('#eg').value,
        Status: status,
        Favorite: isFav
      };
      const ok = await run(() => S.id ? updatePoetry(S.id, d) : addPoetry(d), status === 'Complete' ? 'fa-check-circle' : 'fa-clock-o');
      if (ok) {
        S.dirty = false;
        go(S.id ? 'read' : 'all', S.id);
      }
    }

    document.addEventListener('click', async e => {
      const x = e.target.closest('[data-id],[data-go],[data-tag],[data-x],[data-st],[data-so],button');
      if (!x) return;
      const D = x.dataset, id = x.id;

      if (D.id) return go('read', D.id);
      if (D.go) return go(D.go, D.a);
      if (D.tag) { S.f.tag = D.tag; LS.s('flt', S.f); return go('all'); }
      if (D.st !== undefined) { S.f.status = D.st; LS.s('flt', S.f); return R(); }
      if (D.so) { S.f.sort = D.so; LS.s('flt', S.f); return R(); }
      if (D.x) {
        S.f = { q: '', cat: '', lang: '', status: '', fav: '', tag: '', sort: S.f.sort };
        LS.s('flt', S.f);
        return R();
      }

      const p = byId(S.id);

      if (id === 'ft') { S.fp = !S.fp; R(); }
      else if (id === 'more') { S.page++; R(); }
      else if (id === 'rnd' && S.items.length) {
        go('read', S.items[Math.random() * S.items.length | 0].ID);
      }
      else if (id === 'z-dec' || id === 'z-inc') {
        const z = LS.g('rs', { s: 20, l: 1.9 });
        z.s = Math.min(34, Math.max(14, Number(z.s) + (id === 'z-inc' ? 2 : -2)));
        LS.s('rs', z);
        const rd = $('#rd');
        if (rd) rd.style.fontSize = z.s + 'px';
      }
      else if (id === 'fv' && p) {
        await run(() => updateFavorite(p.ID, !p.Favorite), !p.Favorite ? 'fa-star' : 'fa-star-o');
        R();
      }
      else if (id === 'ef-btn') {
        const cur = x.dataset.fav === '1';
        x.dataset.fav = cur ? '0' : '1';
        x.classList.toggle('btn-active', !cur);
        x.innerHTML = `<i class="fa ${!cur ? 'fa-star' : 'fa-star-o'}"></i>`;
        S.dirty = true;
      }
      else if (id === 'del' && p) {
        askModal('fa-trash-o', async () => {
          if (await run(() => deletePoetry(p.ID), 'fa-trash')) go('all');
        });
      }
      else if (id === 'cp' && p) {
        try {
          const ta = document.createElement('textarea');
          ta.value = txt(p);
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          toast('fa-clone');
        } catch { toast('fa-times', true); }
      }
      else if (id === 'sh' && p) {
        navigator.share ? navigator.share({ title: p.Title, text: txt(p) }).catch(() => {}) : toast('fa-ban', true);
      }
      else if (id === 'tx' && p) dl(p.Title + '.txt', txt(p), 'text/plain;charset=utf-8');
      else if (id === 'save-inc') save('Incomplete');
      else if (id === 'save-cmp') save('Complete');
      else if (id === 'rf') run(() => Promise.resolve(), 'fa-refresh').then(R);
      else if (id === 'ej') dl('poetries-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(S.items, null, 1), 'application/json');
      else if (id === 'ec2') dl('poetries.csv', '\ufeff' + csv(), 'text/csv;charset=utf-8');
      else if (id === 'lo') logout();
    });

    let tm;
    document.addEventListener('input', e => {
      const t = e.target, id = t.id;
      if (id === 'sq') {
        clearTimeout(tm);
        tm = setTimeout(() => {
          S.f.q = t.value;
          LS.s('flt', S.f);
          const pos = t.selectionStart;
          S.page = 1;
          R();
          const n = $('#sq');
          if (n) { n.focus(); n.setSelectionRange(pos, pos); }
        }, 220);
      } else if (id === 'fc' || id === 'fl') {
        S.f[id === 'fc' ? 'cat' : 'lang'] = t.value;
        LS.s('flt', S.f);
        S.page = 1;
        R();
      } else if (S.view === 'edit') {
        S.dirty = true;
      }
    });

    initG();
  </script>
</body>
</html>
