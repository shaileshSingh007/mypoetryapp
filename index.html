<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Poetry App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f3ee;
        color: #2d1b12;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        max-width: 700px;
        background: #fffaf5;
        border: 1px solid #ead8ca;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        padding: 40px 30px;
        text-align: center;
      }

      h1 {
        font-size: 2.4rem;
        margin-bottom: 16px;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>My Poetry App</h1>
      <p>“Poetry is when an emotion has found its thought and the thought has found words.”</p>
      <p>– Robert Frost</p>
    </div>
  </body>
</html>
