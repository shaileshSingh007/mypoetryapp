<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Sukhan</title>
  <meta name="theme-color" content="#0b0b0e">
  <!-- Typography & FontAwesome 4.7 Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Noto+Serif+Devanagari:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0b0b0e;
      --surface: #131318;
      --surface-2: #1a1a22;
      --tx: #f0ece1;
      --mu: #7e7a72;
      --g: #d4af37;
      --g2: #f3e5ab;
      --g-dim: rgba(212, 175, 55, 0.14);
      --bd: #24242e;
      --danger: #e05246;
      --ok: #50b878;
      --grad-border: linear-gradient(135deg, rgba(212,175,55,0.45), rgba(130,100,220,0.22), rgba(212,175,55,0.08));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 'Inter', sans-serif;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    /* Tactile Click Effect for All Interactive Controls */
    button, .icon-btn, .tab-btn, .act-btn, .font-btn, .gh-btn {
      position: relative;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    button:active:not(:disabled),
    .icon-btn:active,
    .tab-btn:active,
    .act-btn:active,
    .font-btn:active,
    .gh-btn:active:not(:disabled) {
      transform: scale(0.88) !important;
      filter: brightness(1.25);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.35);
    }

    /* Gradient Border Utility */
    .grad-box {
      position: relative;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid transparent;
      background-clip: padding-box;
    }
    .grad-box::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: var(--grad-border);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ===== FIRST SCREEN: LOGIN ===== */
    #login {
      height: 100dvh;
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;
      position: relative;
      background: radial-gradient(circle at 50% 28%, rgba(212, 175, 55, 0.10), transparent 65%);
    }

    .logo-wrap {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: linear-gradient(145deg, #17171f, #0d0d12);
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.22), inset 0 0 15px rgba(212, 175, 55, 0.15);
      animation: floatPulse 4s ease-in-out infinite;
    }

    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--g), transparent, var(--g2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spinGlow 8s linear infinite;
    }

    .logo-svg {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.55));
    }

    @keyframes floatPulse {
      0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 0 24px rgba(212, 175, 55, 0.2); }
      50% { transform: translateY(-6px) scale(1.03); box-shadow: 0 0 38px rgba(212, 175, 55, 0.42); }
    }

    @keyframes spinGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .poetic-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3em;
      font-weight: 600;
      letter-spacing: 3px;
      margin: 0;
      background: linear-gradient(90deg, #fff, var(--g2), var(--g));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .poetic-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--mu);
      font-size: 1.1em;
      margin-top: -12px;
      letter-spacing: 1px;
    }

    /* Curator Stamp */
    .curator-stamp {
      margin-top: 14px;
      padding: 10px 20px;
      border-radius: 99px;
      background: rgba(21, 21, 27, 0.85);
      border: 1px dashed rgba(212, 175, 55, 0.45);
      box-shadow: 0 6px 20px rgba(0,0,0,0.45), inset 0 0 12px rgba(212, 175, 55, 0.06);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .stamp-seal {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--g-dim);
      border: 1px solid var(--g);
      color: var(--g);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85em;
    }

    .stamp-details {
      text-align: left;
      line-height: 1.25;
    }

    .stamp-label {
      font-size: 0.65em;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      color: var(--mu);
      display: block;
    }

    .stamp-owner {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15em;
      font-weight: 600;
      color: var(--g2);
    }

    /* ===== MAIN APP CONTAINER ===== */
    #app {
      max-width: 460px;
      margin: 0 auto;
      height: var(--app-h, 100vh);
      min-height: var(--app-h, 100vh);
      max-height: var(--app-h, 100vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Top Bar with 2 Tabs */
    header {
      flex-shrink: 0;
      padding: 8px 12px;
      background: rgba(11, 11, 14, 0.92);
      border-bottom: 1px solid var(--bd);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      background: var(--surface);
      padding: 3px;
      border-radius: 11px;
      border: 1px solid var(--bd);
    }

    .tab-btn {
      height: 34px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--mu);
      font-weight: 500;
      font-size: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.on {
      background: linear-gradient(135deg, rgba(212,175,55,0.22), rgba(212,175,55,0.08));
      color: var(--g2);
      border: 1px solid rgba(212,175,55,0.35);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: var(--surface);
      color: var(--tx);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      padding: 0;
      font-size: 19px;
    }
    .icon-btn i, .act-btn i, .tab-btn i, .font-btn i { pointer-events: none; }

    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.on {
      color: var(--g);
      background: var(--g-dim);
      border-color: var(--g);
    }

    /* Main Content Area */
    #m {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px 12px;
    }

    /* ===== POETRY TAB ===== */
    .poetry-first-row {
      flex-shrink: 0;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .search-half {
      width: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .search-half input {
      width: 100%;
      height: 36px;
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 10px;
      color: var(--tx);
      padding: 0 28px 0 28px;
      font-size: 0.85em;
      outline: none;
    }

    .search-half input:focus {
      border-color: var(--g);
    }

    .search-half .s-ico {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mu);
      font-size: 1.05em;
      pointer-events: none;
    }

    .search-half .cut-ico {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mu);
      font-size: 1.25em;
      cursor: pointer;
      padding: 4px;
    }

    .row-toggles {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .filter-replace-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .filter-replace-row select {
      flex: 1;
      min-width: 0;
      height: 36px;
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 9px;
      color: var(--tx);
      font-size: 0.78em;
      padding: 0 4px;
      outline: none;
    }

    .poetry-list-scroll {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 2px 2px 14px 0;
    }
    .poetry-list-scroll > * { flex-shrink: 0; }

    .poetry-list-scroll::-webkit-scrollbar { width: 4px; }
    .poetry-list-scroll::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 4px; }

    .poem-card {
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.14s ease;
    }

    .poem-card:active { transform: scale(0.99); }

    /* Card: very thin neutral border */
    .poem-card::before {
      padding: 1px;
      background: rgba(255,255,255,0.07);
    }

    /* Number (left, vertically centered) */
    .pc-num {
      flex-shrink: 0;
      min-width: 22px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--mu);
      font-variant-numeric: tabular-nums;
    }

    /* Thin vertical divider doubles as status: green = published, orange = draft */
    .pc-div {
      flex-shrink: 0;
      align-self: stretch;
      width: 2px;
      margin: 2px 0;
      border-radius: 2px;
    }
    .pc-div.done { background: var(--ok); }
    .pc-div.draft { background: #f59e42; }

    .poem-fav {
      flex-shrink: 0;
      color: var(--g);
      font-size: 15px;
    }

    .poem-info {
      min-width: 0;
      flex: 1;
    }

    .poem-head {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .poem-title {
      font-family: 'Cormorant Garamond', 'Noto Serif Devanagari', serif;
      font-size: 1.25em;
      font-weight: 600;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-right-icons {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      font-size: 0.8em;
    }

    .poem-sub {
      margin: 3px 0 0;
      font-size: 0.82em;
      color: var(--mu);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Noto Serif Devanagari', Georgia, serif;
    }

    .poem-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .act-btn {
      width: 36px;
      height: 36px;
      font-size: 18px;
      border-radius: 9px;
      border: 1px solid var(--bd);
      background: var(--surface-2);
      color: var(--mu);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .act-btn:hover {
      color: var(--tx);
      border-color: var(--g);
    }

    .act-btn.del:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    /* ===== CREATE TAB ===== */
    .create-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    body.kb-open .editor-container {
      flex: 0 0 calc(var(--vv-h, 55vh) - 64px) !important;
      max-height: calc(var(--vv-h, 55vh) - 64px) !important;
    }

    /* Publish Metadata Popup Modal */
    #pub-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      z-index: 105;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .pm-box {
      width: 100%;
      max-width: 360px;
      padding: 18px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pm-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--g2);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.25em;
      letter-spacing: 0.5px;
    }

    .pm-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .pm-status-row {
      display: grid;
      grid-template-columns: 1fr 38px;
      gap: 8px;
      align-items: center;
    }

    .pm-pub-btn {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--g);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.28), rgba(212, 175, 55, 0.12));
      color: var(--g2);
      font-weight: 600;
      font-size: 0.92em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 2px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .editor-top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.16);
      background: rgba(11, 11, 14, 0.45);
      z-index: 15;
    }

    #et {
      flex: 1;
      min-width: 0;
      height: 30px;
      background: transparent;
      border: none;
      color: var(--g2);
      font-family: 'Cormorant Garamond', 'Noto Serif Devanagari', serif;
      font-size: 1.18em;
      font-weight: 600;
      padding: 0 4px;
      outline: none;
    }

    #et::placeholder {
      color: var(--mu);
      font-weight: 400;
    }

    .font-float {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .font-btn {
      min-width: 42px;
      height: 32px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.32);
      color: var(--g2);
      border-radius: 7px;
      padding: 0 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .editor-body-wrap {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    #eb {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--tx);
      padding: 10px 12px;
      font-family: 'Noto Serif Devanagari', 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      line-height: 1.75;
      resize: none;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .meter-bar {
      width: 36px;
      background: rgba(0, 0, 0, 0.28);
      border-left: 1px solid var(--bd);
      padding: 10px 2px;
      overflow: hidden;
      text-align: center;
      font-family: 'Inter', monospace;
      font-size: 18px;
      line-height: 1.75;
      color: var(--g);
      user-select: none;
      flex-shrink: 0;
    }

    .meter-line {
      display: block;
      font-size: 0.65em;
      line-height: 2.69;
      color: var(--g);
      opacity: 0.85;
      white-space: nowrap;
    }

    .meta-row-controls {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1.05fr 36px;
      gap: 6px;
      align-items: center;
    }

    .meta-row-tags {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      height: 36px;
    }

    .inp-grad {
      height: 36px;
      background: var(--surface);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 9px;
      color: var(--tx);
      padding: 0 7px;
      font-size: 0.8em;
      outline: none;
      width: 100%;
    }

    .inp-grad:focus {
      border-color: var(--g);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.15);
    }

    .tags-scroll-box {
      width: 100%;
      height: 36px;
      background: var(--surface);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tags-scroll-box::-webkit-scrollbar { display: none; }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--g-dim);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--g2);
      border-radius: 99px;
      padding: 2px 8px;
      font-size: 0.74em;
      flex-shrink: 0;
    }

    .tag-chip i {
      cursor: pointer;
      opacity: 0.85;
      font-size: 1.15em;
    }

    .tag-inline-inp {
      background: transparent;
      border: none;
      color: var(--tx);
      font-size: 0.8em;
      outline: none;
      min-width: 65px;
      flex: 1;
    }

    .status-sel {
      flex: 1;
      min-width: 0;
      height: 36px;
      background: var(--surface);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 9px;
      color: var(--tx);
      font-size: 0.78em;
      padding: 0 4px;
      outline: none;
    }

    .reader-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 4px 20px;
    }

    #rd {
      white-space: pre-wrap;
      font-family: 'Noto Serif Devanagari', 'Cormorant Garamond', Georgia, serif;
      color: var(--tx);
      line-height: 1.5;
      word-break: break-word;
    }

    /* GitHub-Style Dual Auth Delete Modal */
    #gh-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .gh-box {
      width: 100%;
      max-width: 340px;
      padding: 18px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gh-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--danger);
      font-weight: 600;
      font-size: 0.95em;
    }

    .gh-prompt {
      font-size: 0.83em;
      color: var(--mu);
      line-height: 1.4;
    }

    .gh-target {
      color: var(--tx);
      font-weight: 600;
      user-select: all;
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 5px;
    }

    .gh-btn {
      height: 38px;
      border-radius: 9px;
      border: 1px solid rgba(224, 82, 70, 0.4);
      background: rgba(224, 82, 70, 0.15);
      color: var(--danger);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .gh-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .gh-btn:not(:disabled) {
      background: var(--danger);
      color: #fff;
    }

    /* Poetic Publishing Overlay Screen */
    #pub-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 11, 14, 0.88);
      backdrop-filter: blur(8px);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;

        .map(line => line.trim())

    // Prevent double-click zoom. (The old touchend double-tap blocker was removed:

    // Common English, Hinglish & Hindi Stopwords, Prepositions & Verbs for Auto-Tagging

      // Devanagari Hindi prepositions, pronouns & verbs
      'है','हैं','था','थे','थी','और','में','मैं','हम','तुम','आप','क्या','क्यों','कब','कहाँ','कैसे','अपना','अपनी','अपने','तेरा','तेरी','तेरे','मेरा','मेरी','मेरे','उसका','उसकी','उसके','इसका','इसकी','इसके','यह','वह','ये','वो','जब','तब','अब','भी','तो','पर','पे','से','को','का','की','के','ने','ही','जो','कोई','कुछ','सब','एक','दो','लिए','साथ','बिना','अंदर','बाहर','ऊपर','नीचे',
      'कर','करा','करी','करे','करो','करना','करनी','करने','करता','करती','करते','किया','किये','किए','मर','मरा','मरी','मरे','मरो','मरना','मरनी','मरने','मरता','मरती','मरते','रह','रहा','रही','रहे','रहो','रहना','रहनी','रहने','रहता','रहती','रहते','दे','दो','दिया','दिये','दिए','देना','देनी','देने','देता','देती','देते','ले','लो','लिया','लिये','लिए','लेना','लेनी','लेने','लेता','लेती','लेते','आ','आया','आयी','आई','आये','आए','आना','आने','आता','आती','आते','जा','गया','गयी','गई','गये','गए','जाना','जाने','जाता','जाती','जाते','हो','हुआ','हुई','हुए','होना','होने','होता','होती','होते','बन','बना','बनी','बने','बनना','बनने','कहा','कही','कहे','कहना','कहने','देखा','देखी','देखे','देखना','देखने','सुना','सुनी','सुने','सुनना','सुनने','चला','चली','चले','चलना','चलने','मिला','मिली','मिले','मिलना','मिलने','रख','रखा','रखी','रखे','रखना','रखने','सोच','सोचा','सोचना','समझ','समझना','लगा','लगी','लगे','लगना','लगने','चाह','चाहा','चाहिए','चाहता','चाहती','चाहते','सकता','सकती','सकते','चुका','चुकी','चुके','पाया','पायी','पाए','पाना','पाने','बोल','बोला','बोलना','लिख','लिखा','लिखना','पढ़','पढ़ा','पढ़ना','बैठ','बैठा','बैठना','उठ','उठा','उठना','रो','रोया','रोना','हँस','हँसना','जी','जिया','जीना'
    ]);

    function isLikelyVerb(word) {
      if (STOP_WORDS.has(word)) return true;
      if (/^(kar|mar|rah|reh|dekh|sun|chal|mil|rakh|soch|samajh|lag|chah|sak|chuk|bol|likh|padh|baith|uth)(na|ni|ne|ta|ti|te|a|i|e|o|ungi|unga|enge)$/i.test(word)) return true;
      if (/(ना|नी|ने|ता|ती|ते|ऊँगा|ऊँगी|एंगे|एगा|एगी)$/.test(word) && word.length <= 6) return true;
      return false;
    }

    const S = {
      items: [],
      view: 'poetry', // 'poetry' | 'create' | 'read'
      id: null,
      fp: false, // filter row toggle
      f: LS.g('flt', { q: '', cat: '', lang: '', status: '', fav: '', sort: 'new' }),
      draft: {
        Title: '',
        Category: 'Kavita',
        Language: 'Hindi',
        Content: '',
        Tags: [],
        Status: 'Incomplete',
        Favorite: false,
        fontSize: 18
      },
      delTarget: null
    };

    let TOKEN = LS.g('tok', ''), busy = false;

    function isComplete(status) {
      const s = String(status || '').trim().toLowerCase();
      return s === 'complete' || s === 'completed' || s === 'published';
    }

    // Status of a poem. If the server ever keeps a different status than the one
    // we saved, the value you chose is remembered locally (S.ov) so the list stays correct.
    const OV = LS.g('ov', {});
    function isDone(p) {
      if (p && Object.prototype.hasOwnProperty.call(OV, p.ID)) return !!OV[p.ID];
      return isComplete(p?.Status);
    }

    function toast(icon = 'fa-check', msg = '', err = false) {
      const e = $('#toast');
      e.innerHTML = `<i class="fa ${icon}"></i>${msg ? `<span>${E(msg)}</span>` : ''}`;
      e.style.color = err ? 'var(--danger)' : 'var(--g)';
      e.style.borderColor = err ? 'var(--danger)' : 'var(--g)';
      e.style.display = 'inline-flex';
      setTimeout(() => e.style.display = 'none', 2000);
    }

    // ---- Devanagari / Urdu Matra (Meter) Calculator per line ----
    function calcDevanagariMatra(line) {
      const clean = line.trim();
      if (!clean) return '·';
      if (/[\u0900-\u097F]/.test(clean)) {
        let count = 0;
        const chars = Array.from(clean);
        for (let i = 0; i < chars.length; i++) {
          const code = chars[i].charCodeAt(0);
          // Independent vowels
          if (code >= 0x0904 && code <= 0x0914) {
            if ([0x0905, 0x0907, 0x0909, 0x090B].includes(code)) count += 1;
            else count += 2;
          }
          // Consonants (क to ह)
          else if (code >= 0x0915 && code <= 0x0939) {
            const next = chars[i + 1] ? chars[i + 1].charCodeAt(0) : 0;
            if (next === 0x094D) {
              i++; // halant: skip
            }
            else if ([0x093E, 0x0940, 0x0942, 0x0947, 0x0948, 0x094B, 0x094C, 0x0902, 0x0903].includes(next)) {
              count += 2;
              i++;
            }
            else if ([0x093F, 0x0941, 0x0943, 0x0901].includes(next)) {
              count += 1;
              i++;
            } else {
              count += 1;
            }
          }
        }
        return count || '·';
      }
      const words = clean.split(/\s+/).filter(Boolean);
      let syl = 0;
      words.forEach(w => {
        const m = w.match(/[aeiouy]+/gi);
        syl += m ? m.length : 1;
      });
      return syl || '·';
    }

    // ---- Auto Tag Extractor from Content ----
    function extractSmartTags(content, existingTags = []) {
      const words = String(content || '')
        .replace(/[.,!?;:"'()\[\]{}|\\/<>~`@#$%^&*_+=—–\-।॥]+/g, ' ')
        .split(/\s+/)
        .map(w => w.trim().toLowerCase())
        .filter(w => w.length >= 3 && !isLikelyVerb(w) && isNaN(w));

      const freq = {};
      words.forEach(w => freq[w] = (freq[w] || 0) + 1);
      const sorted = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
      const combined = [...new Set([...existingTags, ...sorted.slice(0, 6)])];
      return combined.slice(0, 8);
    }

    function jwt(t) {
      try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))) }
      catch { return null }
    }

    // ---- Auth ----
    function showLogin(errMsg = '') {
      $('#app').classList.add('hide');
      $('#login').classList.remove('hide');
      $('#lerr').textContent = errMsg;

    function onCred(r) {
      const p = jwt(r.credential);
      if (!p || String(p.email).toLowerCase() !== CFG.EMAIL.toLowerCase() || !p.email_verified) {
        return showLogin('Unauthorized sanctuary access.');
      }
      TOKEN = r.credential;
      LS.s('tok', TOKEN);
      start();
    }

    function logout() {
      TOKEN = '';
      localStorage.removeItem('tok');
      localStorage.removeItem('pc');
      S.items = [];
      if (window.google?.accounts?.id) google.accounts.id.disableAutoSelect();
      showLogin();

    function initG() {
      if (!window.google || !google.accounts) return setTimeout(initG, 300);
      google.accounts.id.initialize({ client_id: CFG.CLIENT_ID, callback: onCred, auto_select: true });
      google.accounts.id.renderButton($('#gb'), { theme: 'filled_black', size: 'large', text: 'continue_with', shape: 'pill' });
      const p = jwt(TOKEN);
      if (p && p.exp * 1000 > Date.now() + 6e4) start();
      else { showLogin(); google.accounts.id.prompt(); }
    }

    // ---- Universal Fullscreen Loader Helper ----
    let loaderDepth = 0;
    function showLoader(msg) {
      const ov = $('#pub-overlay');
      const stTxt = $('#pub-status-txt');
      if (msg && stTxt) stTxt.textContent = msg;
      loaderDepth++;
      if (ov) ov.classList.remove('hide');
    }

    function hideLoader() {
      loaderDepth = Math.max(0, loaderDepth - 1);
      if (loaderDepth === 0) {
        const ov = $('#pub-overlay');
        if (ov) ov.classList.add('hide');
      }
    }

    function actionLoaderText(action, data) {
      if (action === 'list') return 'Awakening your Diwan...';
      if (action === 'delete') return 'Releasing verses to the wind...';
      if (action === 'favorite') return 'Adorning your verse...';
      if (action === 'add' || action === 'update') {
        return isComplete(data?.Status) ? 'Immortalizing your verses...' : 'Preserving your draft...';
      }
      return 'Inscribing into your Diwan...';
    }

    // ---- API Service ----
    async function api(action, data) {
      showLoader(actionLoaderText(action, data));
      try {
        const r = await fetch(CFG.API_URL, {
          method: 'POST',
          redirect: 'follow',
          credentials: 'omit',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ token: TOKEN, action, data })
        });
        const j = await r.json();
        if (!j.ok) {
          if (j.error === 'auth') {
            logout();
            showLogin('Session expired.');
            throw 0;
          }
          throw new Error(j.error);
        }
        return j;
      } catch (e) {
        if (e === 0) throw e;
        throw new Error('Offline');
      } finally {
        hideLoader();
      }
    }

    const getAllPoetries = async () => { const j = await api('list'); S.items = j.data; LS.s('pc', j.data); };
    const addPoetry = d => api('add', d);
    const updatePoetry = (id, d) => api('update', { ...d, id });
    const deletePoetry = id => api('delete', { id });
    const updateFavorite = (id, value) => api('favorite', { id, value });

    async function start() {
      $('#login').classList.add('hide');
      $('#app').classList.remove('hide');
      S.items = LS.g('pc', []);
      go('poetry');
      try { await getAllPoetries(); }
      catch (e) { if (e) toast('fa-cloud-download', 'Cached', true); }
      R();
    }

    const byId = id => S.items.find(p => p.ID === id);
    const cats = () => [...new Set(['Kavita', 'Poetry', 'Ghazal', 'Nazm', 'Shayari', ...S.items.map(p => p.Category).filter(Boolean)])];

    function filteredList() {
      const f = S.f, q = f.q.toLowerCase();
      let a = S.items.filter(p => {
        const comp = isDone(p);
        // Anything that is not complete counts as a draft (Incomplete / Draft / empty)
        const matchStatus = !f.status || (f.status === 'Complete' ? comp : !comp);
        const matchFav = !f.fav || p.Favorite;
        return (!q || [p.Title, p.Content, p.Category, p.Tags, p.Language].join(' ').toLowerCase().includes(q)) &&
          (!f.cat || p.Category === f.cat) &&
          (!f.lang || p.Language === f.lang) &&
          matchStatus &&
          matchFav;
      });
      const s = {
        new: (x, y) => y.CreatedAt > x.CreatedAt ? 1 : -1,
        old: (x, y) => x.CreatedAt > y.CreatedAt ? 1 : -1,
        az: (x, y) => String(x.Title).localeCompare(String(y.Title))
      };
      return a.sort(s[f.sort] || s.new);
    }

    // ---- Top Bar Header ----
    function renderHeader() {
      const h = $('#hdr');
      if (S.view === 'read') {
        const p = byId(S.id);
        h.innerHTML = `
          <button class="icon-btn" data-go="poetry"><i class="fa fa-arrow-left"></i></button>
          <div style="flex:1;font-family:'Cormorant Garamond',serif;font-size:1.25em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${E(p?.Title || '')}</div>
          <button class="icon-btn" id="rd-dec"><i class="fa fa-minus"></i></button>
          <button class="icon-btn" id="rd-inc"><i class="fa fa-plus"></i></button>
          <button class="icon-btn ${p?.Favorite ? 'on' : ''}" id="rd-fav"><i class="fa ${p?.Favorite ? 'fa-star' : 'fa-star-o'}"></i></button>
          <button class="icon-btn" data-edit="${E(p?.ID || '')}"><i class="fa fa-pencil"></i></button>`;
        return;
      }

      h.innerHTML = `
        <div class="top-tabs">
          <button class="tab-btn ${S.view === 'poetry' ? 'on' : ''}" data-go="poetry">
            <i class="fa fa-book"></i>
          </button>
          <button class="tab-btn ${S.view === 'create' ? 'on' : ''}" data-go="create">
            <i class="fa fa-pencil-square-o"></i>
          </button>
        </div>
        ${S.view === 'create'
          ? `<button id="save-btn" class="icon-btn on" title="Save"><i class="fa fa-check"></i></button>`
          : `<button id="rf-btn" class="icon-btn" title="Sync"><i class="fa fa-refresh"></i></button>`
        }`;
    }

    function loadIntoCreate(p) {
      if (p) {
        S.id = p.ID;
        S.draft = {
          Title: p.Title || '',
          Category: p.Category || 'Kavita',
          Language: p.Language || 'Hindi',
          Content: p.Content || '',
          Tags: String(p.Tags || '').split(',').map(x => x.trim()).filter(Boolean),
          Status: isDone(p) ? 'Completed' : 'Incomplete',
          Favorite: !!p.Favorite,
          fontSize: S.draft.fontSize || 18
        };
      } else {
        S.id = null;
        S.draft = {
          Title: '',
          Category: 'Kavita',
          Language: 'Hindi',
          Content: '',
          Tags: [],
          Status: 'Incomplete',
          Favorite: false,
          fontSize: 18
        };
      }
    }

    function go(v, id = null) {
      if (v === 'create' && !id && S.view !== 'create') {
        loadIntoCreate(null);
      }
      S.view = v;
      if (id !== null) S.id = id;
      R();
    }

    function R() {
      renderHeader();
      const m = $('#m');
      if (S.view === 'poetry') m.innerHTML = viewPoetry();
      else if (S.view === 'create') {
        m.innerHTML = viewCreate();
        updateMeterBar();
        bindCreateEvents();
      }
      else if (S.view === 'read') m.innerHTML = viewRead();
    }

    // ---- VIEW 1: POETRY TAB ----
    function viewPoetry() {
      const f = S.f;
      const list = filteredList();
      const hasActiveFilter = f.cat || f.lang || f.fav || f.status || f.q;
      // Stable serial number: oldest poem = 1
      const numMap = {};
      [...S.items].sort((x, y) => String(x.CreatedAt) > String(y.CreatedAt) ? 1 : -1)
        .forEach((p, i) => { numMap[p.ID] = i + 1; });

      const firstRowHTML = !S.fp ? `
        <div class="search-half">
          <i class="fa fa-search s-ico"></i>
          <input id="sq" type="text" placeholder="Search..." value="${E(f.q)}">
          ${f.q ? `<i id="sq-cut" class="fa fa-times-circle cut-ico"></i>` : ''}
        </div>
        <div class="row-toggles">
          <button class="icon-btn ${f.status === 'Incomplete' ? 'on' : ''}" data-st="Incomplete" title="Draft">
            <i class="fa fa-clock-o"></i>
          </button>
          <button class="icon-btn ${f.status === 'Complete' ? 'on' : ''}" data-st="Complete" title="Published">
            <i class="fa fa-check-circle"></i>
          </button>
          <button class="icon-btn ${hasActiveFilter ? 'on' : ''}" id="open-flt" title="Filters">
            <i class="fa fa-sliders"></i>
          </button>
        </div>
      ` : `
        <div class="filter-replace-row">
          <select id="flt-cat">
            <option value="">Type</option>
            ${cats().map(c => `<option value="${E(c)}" ${f.cat === c ? 'selected' : ''}>${E(c)}</option>`).join('')}
          </select>
          <select id="flt-lang">
            <option value="">Lang</option>
            ${['Hindi', 'English', 'Hinglish', 'Urdu'].map(l => `<option value="${l}" ${f.lang === l ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
          <button class="icon-btn ${f.fav ? 'on' : ''}" id="flt-fav" title="Favorites">
            <i class="fa fa-star"></i>
          </button>
          <button class="icon-btn" id="flt-clear" title="Clear Filters">
            <i class="fa fa-eraser"></i>
          </button>
          <button class="icon-btn" id="flt-close" title="Close">
            <i class="fa fa-times"></i>
          </button>
        </div>
      `;

      return `
        <div class="poetry-first-row">${firstRowHTML}</div>
        <div class="poetry-list-scroll">
          ${list.map(p => {
            const comp = isDone(p);
            const firstLine = String(p.Content || '').split('\n').find(l => l.trim()) || '...';
            return `
              <div class="poem-card grad-box" data-read="${E(p.ID)}">
                <div class="pc-num">${numMap[p.ID] || ''}</div>
                <div class="pc-div ${comp ? 'done' : 'draft'}"></div>
                <div class="poem-info">
                  <div class="poem-head">
                    <span class="poem-title">${E(p.Title)}</span>
                    ${p.Favorite ? `<i class="fa fa-star poem-fav"></i>` : ''}
                  </div>
                  <p class="poem-sub">${E(firstLine)}</p>
                </div>
                <div class="poem-actions">
                  <button class="act-btn" data-edit="${E(p.ID)}" title="Edit"><i class="fa fa-pencil"></i></button>
                  <button class="act-btn del" data-del="${E(p.ID)}" title="Delete"><i class="fa fa-trash-o"></i></button>
                </div>
              </div>`;
          }).join('') || `<div style="text-align:center;margin:auto;color:var(--mu)"><i class="fa fa-book" style="font-size:2em;opacity:0.4"></i></div>`}
        </div>`;
    }

    // ---- VIEW 2: CREATE TAB ----
    function viewCreate() {
      const d = S.draft;
      const showMeter = d.Language === 'Hindi' || d.Language === 'Urdu';

      return `
        <div class="create-wrap">
          <div class="editor-container grad-box">
            <div class="editor-top-bar">
              <input id="et" placeholder="Title" value="${E(d.Title)}" autocomplete="off">
              <div class="font-float">
                <button class="font-btn" id="cr-fdec" type="button"><i class="fa fa-minus"></i><i class="fa fa-font"></i></button>
                <button class="font-btn" id="cr-finc" type="button"><i class="fa fa-plus"></i><i class="fa fa-font"></i></button>
              </div>
            </div>
            <div class="editor-body-wrap">
              <textarea id="eb" style="font-size:${d.fontSize}px" placeholder="उतरने दो काग़ज़ पर रूह के अल्फ़ाज़...">${E(d.Content)}</textarea>
              <div id="meter-col" class="meter-bar ${showMeter ? '' : 'hide'}" style="font-size:${d.fontSize}px" title="Matra / Meter Count per line"></div>
            </div>
          </div>
        </div>`;
    }

    // Tick mark opens the popup directly. Validation happens on the Publish button.
    function openPublishModal() {
      const d = S.draft;
      d.Title = ($('#et')?.value || '').trim();
      d.Content = $('#eb')?.value || '';

      if (d.Content.trim()) d.Tags = extractSmartTags(d.Content, d.Tags);

      const types = ['Kavita', 'Poetry', 'Ghazal', 'Nazm', 'Shayari', 'Geet', 'Free Verse'];
      const langs = ['Hindi', 'English', 'Hinglish', 'Urdu'];

      const ec = $('#ec');
      const el = $('#el');
      const es = $('#es');
      const ef = $('#ef-toggle');

      if (ec) ec.innerHTML = types.map(t => `<option value="${t}" ${String(d.Category).toLowerCase() === t.toLowerCase() ? 'selected' : ''}>${t}</option>`).join('');
      if (el) el.innerHTML = langs.map(l => `<option value="${l}" ${d.Language === l ? 'selected' : ''}>${l}</option>`).join('');
      if (es) es.value = d.Status || 'Incomplete';
      if (ef) {
        ef.classList.toggle('on', !!d.Favorite);
        ef.innerHTML = `<i class="fa ${d.Favorite ? 'fa-star' : 'fa-star-o'}"></i>`;
      }

      refreshTagBox();
      $('#pub-modal').classList.remove('hide');
    }

    function renderTagChips() {
      return S.draft.Tags.map((t, idx) => `
        <span class="tag-chip">
          #${E(t)} <i class="fa fa-times" data-rmtag="${idx}"></i>
        </span>`).join('');
    }

    function refreshTagBox() {
      const box = $('#tag-box');
      if (!box) return;
      const inpVal = $('#tag-inp')?.value || '';
      box.innerHTML = `${renderTagChips()}<input id="tag-inp" class="tag-inline-inp" placeholder="+tag," value="${E(inpVal)}">`;
      bindTagInput();
    }

    function updateMeterBar() {
      const eb = $('#eb');
      const col = $('#meter-col');
      if (!eb || !col) return;
      const show = S.draft.Language === 'Hindi' || S.draft.Language === 'Urdu';
      col.classList.toggle('hide', !show);
      if (!show) return;
      const lines = eb.value.split('\n');
      col.innerHTML = lines.map(l => `<span class="meter-line">${calcDevanagariMatra(l)}</span>`).join('');
      col.scrollTop = eb.scrollTop;
    }

    function bindTagInput() {
      const ti = $('#tag-inp');
      if (!ti) return;
      const commitCommaTags = () => {
        const raw = ti.value;
        if (!raw.trim()) return;
        const parts = raw.split(',').map(x => x.trim().replace(/^#/, '')).filter(Boolean);
        parts.forEach(p => {
          if (!S.draft.Tags.includes(p)) S.draft.Tags.push(p);
        });
        ti.value = '';
        refreshTagBox();
      };
      ti.onblur = commitCommaTags;
      ti.onkeydown = e => {
        if (e.key === ',' || e.key === 'Enter') {
          e.preventDefault();
          commitCommaTags();
          $('#tag-inp')?.focus();
        }
      };
    }

    function bindCreateEvents() {
      const eb = $('#eb');
      const et = $('#et');
      if (et) {
        et.onpaste = e => {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text');
          const clean = reformatPoetryText(pasted).replace(/\n+/g, ' ');
          const start = et.selectionStart, end = et.selectionEnd;
          et.value = et.value.slice(0, start) + clean + et.value.slice(end);
          et.selectionStart = et.selectionEnd = start + clean.length;
          S.draft.Title = et.value;
        };
      }
      if (eb) {
        eb.onpaste = e => {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text');
          const clean = reformatPoetryText(pasted);
          const start = eb.selectionStart, end = eb.selectionEnd;
          eb.value = eb.value.slice(0, start) + clean + eb.value.slice(end);
          eb.selectionStart = eb.selectionEnd = start + clean.length;
          S.draft.Content = eb.value;
          updateMeterBar();
          S.draft.Tags = extractSmartTags(eb.value, S.draft.Tags);
          refreshTagBox();
        };
        eb.onscroll = () => {
          const col = $('#meter-col');
          if (col) col.scrollTop = eb.scrollTop;
        };
        eb.oninput = () => {
          S.draft.Content = eb.value;
          updateMeterBar();
        };
        eb.onblur = () => {
          if (eb.value.trim()) {
            S.draft.Tags = extractSmartTags(eb.value, S.draft.Tags);
            refreshTagBox();
          }
        };
      }
      bindTagInput();
    }

    // ---- VIEW 3: READ VIEW ----
    function viewRead() {
      const p = byId(S.id);
      if (!p) return `<div style="margin:auto;color:var(--mu)">Not found</div>`;
      const z = LS.g('rs', 20);
      const comp = isDone(p);
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px;border-bottom:1px solid var(--bd);font-size:0.82em;color:var(--mu)">
          <span>${E(p.Category)} · ${E(p.Language)}</span>
          <span style="color:${comp ? 'var(--ok)' : 'var(--g)'}">
            <i class="fa ${comp ? 'fa-check-circle' : 'fa-clock-o'}"></i> ${comp ? 'Published' : 'Draft'}
          </span>
        </div>
        <div class="reader-scroll">
          <div id="rd" style="font-size:${z}px">${E(p.Content)}</div>
        </div>`;
    }

    // ---- Save & Actions ----
    async function run(fn, icon = 'fa-check', msg = '', loaderMsg = '') {
      if (busy) return false;
      busy = true;
      showLoader(loaderMsg);
      try {
        await fn();
        await getAllPoetries();
        toast(icon, msg);
        return true;
      } catch (e) {
        if (e) toast('fa-exclamation-circle', 'Error', true);
        return false;
      } finally {
        hideLoader();
        busy = false;
      }
    }

    async function saveCreation() {
      const d = S.draft;
      d.Title = ($('#et')?.value || '').trim();
      d.Category = $('#ec')?.value || d.Category || 'Kavita';
      d.Language = $('#el')?.value || d.Language || 'Hindi';
      d.Content = $('#eb')?.value || '';
      d.Status = $('#es')?.value || d.Status || 'Incomplete';

      if (!d.Title || !d.Content.trim()) {
        toast('fa-exclamation', 'Title & verse needed', true);
        return false;
      }
      if (!d.Tags.length) {
        d.Tags = extractSmartTags(d.Content, []);
      }

      const payload = {
        Title: d.Title,
        Category: d.Category,
        Language: d.Language,
        Content: d.Content,
        Tags: d.Tags.join(', '),
        Status: d.Status === 'Completed' ? 'Published' : 'Draft',
        Favorite: d.Favorite
      };

      const editingId = S.id;
      const wantDone = payload.Status === 'Published';
      const ok = await run(
        () => editingId ? updatePoetry(editingId, payload) : addPoetry(payload),
        'fa-check',
        'Saved'
      );
      if (ok && editingId) {
        const saved = byId(editingId);
        if (saved && isComplete(saved.Status) !== wantDone) {
          // Server did not keep the chosen status: remember it locally and warn
          OV[editingId] = wantDone;
          LS.s('ov', OV);
          setTimeout(() => toast('fa-exclamation-circle', 'Server kept "' + (saved.Status || 'empty') + '"', true), 2100);
        } else if (OV[editingId] !== undefined) {
          delete OV[editingId];
          LS.s('ov', OV);
        }
      }
      if (ok) go('poetry');
      return ok;
    }

    // Checks everything on Publish click. If something is missing the popup stays open.
    async function publishWithScreen() {
      const d = S.draft;
      d.Title = ($('#et')?.value || d.Title || '').trim();
      d.Category = $('#ec')?.value || d.Category || 'Kavita';
      d.Language = $('#el')?.value || d.Language || 'Hindi';
      d.Content = $('#eb')?.value || d.Content || '';
      d.Status = $('#es')?.value || d.Status || 'Incomplete';

      if (!d.Title || !d.Content.trim()) {
        return toast('fa-exclamation', 'Title & verse needed', true);
      }

      $('#pub-modal').classList.add('hide');
      const ok = await saveCreation();
      // If the save failed, bring the popup back so nothing is lost
      if (!ok && S.view === 'create') $('#pub-modal').classList.remove('hide');
    }

    // ---- GitHub Dual-Auth Delete Setup ----
    function openDualAuthDelete(poemId) {
      const p = byId(poemId);
      if (!p) return;
      S.delTarget = p;
      $('#gh-title-lbl').textContent = p.Title;
      const inp = $('#gh-inp');
      const btn = $('#gh-confirm');
      inp.value = '';
      btn.disabled = true;
      $('#gh-modal').classList.remove('hide');
      setTimeout(() => inp.focus(), 60);
    }

    $('#gh-inp').addEventListener('input', e => {
      if (!S.delTarget) return;
      const match = e.target.value.trim() === S.delTarget.Title.trim();
      $('#gh-confirm').disabled = !match;
    });

    $('#gh-close').addEventListener('click', () => {
      $('#gh-modal').classList.add('hide');
      S.delTarget = null;
    });

    $('#gh-confirm').addEventListener('click', async () => {
      if (!S.delTarget) return;
      const id = S.delTarget.ID;
      $('#gh-modal').classList.add('hide');
      S.delTarget = null;
      await run(() => deletePoetry(id), 'fa-trash', 'Deleted');
      R();
    });

    // ---- Global Click & Input Delegation ----
    document.addEventListener('click', async e => {
      // Filter panel open/close (handled first so nothing else can intercept it)
      const fltToggle = e.target.closest('#open-flt, #flt-close');
      if (fltToggle) {
        e.preventDefault();
        S.fp = fltToggle.id === 'open-flt';
        R();
        return;
      }

      // Remove tag chip
      const rmTag = e.target.closest('[data-rmtag]');
      if (rmTag) {
        const idx = Number(rmTag.dataset.rmtag);
        S.draft.Tags.splice(idx, 1);
        refreshTagBox();
        return;
      }

      // Edit button on list or reader
      const editBtn = e.target.closest('[data-edit]');
      if (editBtn) {
        e.stopPropagation();
        const p = byId(editBtn.dataset.edit);
        if (p) {
          loadIntoCreate(p);
          go('create', p.ID);
        }
        return;
      }

      // Delete button on list
      const delBtn = e.target.closest('[data-del]');
      if (delBtn) {
        e.stopPropagation();
        openDualAuthDelete(delBtn.dataset.del);
        return;
      }

      // Read card click
      const readCard = e.target.closest('[data-read]');
      if (readCard) {
        go('read', readCard.dataset.read);
        return;
      }

      // Navigation tabs
      const goBtn = e.target.closest('[data-go]');
      if (goBtn) {
        go(goBtn.dataset.go);
        return;
      }

      // Draft / Published toggle icons
      const stBtn = e.target.closest('[data-st]');
      if (stBtn) {
        const val = stBtn.dataset.st;
        S.f.status = S.f.status === val ? '' : val;
        LS.s('flt', S.f);
        R();
        return;
      }

      // FIX: only match elements that have an id. Previously 'button, i' returned the
      // inner <i> icon (no id) when the icon was tapped, so the action never ran.
      const btn = e.target.closest('button[id], i[id]');
      if (!btn) return;
      const id = btn.id;

      if (id === 'sq-cut') {
        S.f.q = '';
        LS.s('flt', S.f);
        R();
        $('#sq')?.focus();
      }
      else if (id === 'open-flt') { S.fp = true; R(); }
      else if (id === 'flt-close') { S.fp = false; R(); }
      else if (id === 'flt-clear') {
        S.f = { q: '', cat: '', lang: '', status: '', fav: '', sort: 'new' };
        LS.s('flt', S.f);
        R();
      }
      else if (id === 'flt-fav') {
        S.f.fav = S.f.fav ? '' : '1';
        LS.s('flt', S.f);
        R();
      }
      else if (id === 'cr-finc' || id === 'cr-fdec') {
        e.preventDefault();
        e.stopPropagation();
        S.draft.fontSize = Math.min(32, Math.max(12, S.draft.fontSize + (id === 'cr-finc' ? 2 : -2)));
        const eb = $('#eb');
        const mc = $('#meter-col');
        if (eb) eb.style.fontSize = S.draft.fontSize + 'px';
        if (mc) mc.style.fontSize = S.draft.fontSize + 'px';
      }
      else if (id === 'ef-toggle') {
        S.draft.Favorite = !S.draft.Favorite;
        btn.classList.toggle('on', S.draft.Favorite);
        btn.innerHTML = `<i class="fa ${S.draft.Favorite ? 'fa-star' : 'fa-star-o'}"></i>`;
      }
      else if (id === 'save-btn') {
        openPublishModal();
      }
      else if (id === 'pm-close') {
        $('#pub-modal').classList.add('hide');
      }
      else if (id === 'pm-publish-btn') {
        publishWithScreen();
      }
      else if (id === 'rf-btn') {
        run(() => Promise.resolve(), 'fa-refresh', 'Synced').then(R);
      }
      else if (id === 'rd-inc' || id === 'rd-dec') {
        e.preventDefault();
        e.stopPropagation();
        let z = Number(LS.g('rs', 20)) || 20;
        z = Math.min(34, Math.max(13, z + (id === 'rd-inc' ? 2 : -2)));
        LS.s('rs', z);
        const rd = $('#rd');
        if (rd) rd.style.fontSize = z + 'px';
      }
      else if (id === 'rd-fav') {
        const p = byId(S.id);
        if (p) {
          await run(() => updateFavorite(p.ID, !p.Favorite), 'fa-star');
          R();
        }
      }
    });

    let searchTimer;
    document.addEventListener('input', e => {
      const t = e.target, id = t.id;
      if (id === 'sq') {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          S.f.q = t.value;
          LS.s('flt', S.f);
          const pos = t.selectionStart;
          R();
          const n = $('#sq');
          if (n) { n.focus(); n.setSelectionRange(pos, pos); }
        }, 180);
      }
      else if (id === 'flt-cat') { S.f.cat = t.value; LS.s('flt', S.f); R(); }
      else if (id === 'flt-lang') { S.f.lang = t.value; LS.s('flt', S.f); R(); }
      else if (id === 'et') S.draft.Title = t.value;
      else if (id === 'ec') S.draft.Category = t.value;
      else if (id === 'el') {
        S.draft.Language = t.value;
        updateMeterBar();
      }
      else if (id === 'es') S.draft.Status = t.value;
    });

    initG();
  </script>
