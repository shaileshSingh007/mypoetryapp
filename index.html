<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Sukhan</title>
  <meta name="theme-color" content="#0b0b0e">
  <!-- Typography & FontAwesome 4.7 Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Noto+Serif+Devanagari:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0b0b0e;
      --surface: #131318;
      --surface-2: #1a1a22;
      --tx: #f0ece1;
      --mu: #7e7a72;
      --g: #d4af37;
      --g2: #f3e5ab;
      --g-dim: rgba(212, 175, 55, 0.14);
      --bd: #24242e;
      --danger: #e05246;
      --ok: #50b878;
      --grad-border: linear-gradient(135deg, rgba(212,175,55,0.45), rgba(130,100,220,0.22), rgba(212,175,55,0.08));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 'Inter', sans-serif;
    }

    /* Gradient Border Utility */
    .grad-box {
      position: relative;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid transparent;
      background-clip: padding-box;
    }
    .grad-box::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: var(--grad-border);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ===== FIRST SCREEN: LOGIN ===== */
    #login {
      height: 100dvh;
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;
      position: relative;
      background: radial-gradient(circle at 50% 28%, rgba(212, 175, 55, 0.10), transparent 65%);
    }

    .logo-wrap {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: linear-gradient(145deg, #17171f, #0d0d12);
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.22), inset 0 0 15px rgba(212, 175, 55, 0.15);
      animation: floatPulse 4s ease-in-out infinite;
    }

    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--g), transparent, var(--g2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spinGlow 8s linear infinite;
    }

    .logo-svg {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.55));
    }

    @keyframes floatPulse {
      0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 0 24px rgba(212, 175, 55, 0.2); }
      50% { transform: translateY(-6px) scale(1.03); box-shadow: 0 0 38px rgba(212, 175, 55, 0.42); }
    }

    @keyframes spinGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .poetic-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3em;
      font-weight: 600;
      letter-spacing: 3px;
      margin: 0;
      background: linear-gradient(90deg, #fff, var(--g2), var(--g));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .poetic-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--mu);
      font-size: 1.1em;
      margin-top: -12px;
      letter-spacing: 1px;
    }

    /* Curator Stamp */
    .curator-stamp {
      margin-top: 14px;
      padding: 10px 20px;
      border-radius: 99px;
      background: rgba(21, 21, 27, 0.85);
      border: 1px dashed rgba(212, 175, 55, 0.45);
      box-shadow: 0 6px 20px rgba(0,0,0,0.45), inset 0 0 12px rgba(212, 175, 55, 0.06);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .stamp-seal {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--g-dim);
      border: 1px solid var(--g);
      color: var(--g);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85em;
    }

    .stamp-details {
      text-align: left;
      line-height: 1.25;
    }

    .stamp-label {
      font-size: 0.65em;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      color: var(--mu);
      display: block;
    }

    .stamp-owner {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15em;
      font-weight: 600;
      color: var(--g2);
      letter-spacing: 0.5px;
    }

    /* ===== MAIN APP CONTAINER (NO OUTER SCROLL) ===== */
    #app {
      max-width: 460px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Top Bar with 2 Tabs */
    header {
      flex-shrink: 0;
      padding: 8px 12px;
      background: rgba(11, 11, 14, 0.92);
      border-bottom: 1px solid var(--bd);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      background: var(--surface);
      padding: 3px;
      border-radius: 11px;
      border: 1px solid var(--bd);
    }

    .tab-btn {
      height: 34px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--mu);
      font-weight: 500;
      font-size: 0.9em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.on {
      background: linear-gradient(135deg, rgba(212,175,55,0.22), rgba(212,175,55,0.08));
      color: var(--g2);
      border: 1px solid rgba(212,175,55,0.35);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: var(--surface);
      color: var(--tx);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      padding: 0;
    }

    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.on {
      color: var(--g);
      background: var(--g-dim);
      border-color: var(--g);
    }

    /* Main Content Area */
    #m {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px 12px;
    }

    /* ===== POETRY TAB ===== */
    .poetry-first-row {
      flex-shrink: 0;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    /* 50% Width Search Input with Inside Cut Icon */
    .search-half {
      width: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .search-half input {
      width: 100%;
      height: 36px;
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 10px;
      color: var(--tx);
      padding: 0 28px 0 28px;
      font-size: 0.85em;
      outline: none;
    }

    .search-half input:focus {
      border-color: var(--g);
    }

    .search-half .s-ico {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mu);
      font-size: 0.8em;
      pointer-events: none;
    }

    .search-half .cut-ico {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mu);
      font-size: 0.85em;
      cursor: pointer;
      padding: 4px;
    }

    .row-toggles {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    /* Filter Replacement Row */
    .filter-replace-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .filter-replace-row select {
      flex: 1;
      min-width: 0;
      height: 36px;
      background: var(--surface);
      border: 1px solid var(--bd);
      border-radius: 9px;
      color: var(--tx);
      font-size: 0.78em;
      padding: 0 4px;
      outline: none;
    }

    /* Second Row: 100% width, Remaining Height, Scrollable */
    .poetry-list-scroll {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
      padding-bottom: 12px;
    }

    .poetry-list-scroll::-webkit-scrollbar { width: 4px; }
    .poetry-list-scroll::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 4px; }

    .poem-card {
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.14s ease;
    }

    .poem-card:active { transform: scale(0.99); }

    .poem-info {
      min-width: 0;
      flex: 1;
    }

    .poem-head {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .poem-title {
      font-family: 'Cormorant Garamond', 'Noto Serif Devanagari', serif;
      font-size: 1.2em;
      font-weight: 600;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-right-icons {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      font-size: 0.8em;
    }

    .poem-sub {
      margin: 2px 0 0;
      font-family: 'Noto Serif Devanagari', 'Cormorant Garamond', serif;
      font-size: 0.92em;
      color: var(--mu);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .poem-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .act-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--bd);
      background: rgba(255,255,255,0.02);
      color: var(--mu);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .act-btn.del:hover, .act-btn.del:active {
      color: var(--danger);
      border-color: rgba(224, 82, 70, 0.4);
    }

    /* ===== CREATE TAB ===== */
    .create-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    /* Editor + Meter Box */
    .editor-container {
      flex: 1;
      position: relative;
      display: flex;
      overflow: hidden;
      background: var(--surface);
      border-radius: 12px;
    }

    /* Floating Transparent +A / -A Top Right */
    .font-float {
      position: absolute;
      top: 7px;
      right: 44px;
      z-index: 10;
      display: flex;
      gap: 4px;
    }

    .font-btn {
      background: rgba(11, 11, 14, 0.55);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(212, 175, 55, 0.28);
      color: var(--g2);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 0.72em;
      font-weight: 600;
      cursor: pointer;
    }

    /* Main Content Textarea */
    #eb {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--tx);
      padding: 12px 12px;
      font-family: 'Noto Serif Devanagari', 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      line-height: 1.75;
      resize: none;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* Right Side Vertical Meter Bar (For Hindi/Devanagari) */
    .meter-bar {
      width: 36px;
      background: rgba(0, 0, 0, 0.28);
      border-left: 1px solid var(--bd);
      padding: 12px 2px;
      overflow: hidden;
      text-align: center;
      font-family: 'Inter', monospace;
      font-size: 18px;
      line-height: 1.75;
      color: var(--g);
      user-select: none;
      flex-shrink: 0;
    }

    .meter-line {
      display: block;
      font-size: 0.65em;
      line-height: 2.69; /* Synced visually with 1.75em line height */
      color: var(--g);
      opacity: 0.85;
      white-space: nowrap;
    }

    /* After Input Field: Two Rows */
    .meta-row-1 {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1.3fr 1fr 0.9fr;
      gap: 6px;
    }

    .meta-row-2 {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 38px;
    }

    .inp-grad {
      height: 36px;
      background: var(--surface);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 9px;
      color: var(--tx);
      padding: 0 9px;
      font-size: 0.83em;
      outline: none;
      width: 100%;
    }

    .inp-grad:focus {
      border-color: var(--g);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.15);
    }

    /* Tags 60% Width Horizontal Scroll Container */
    .tags-scroll-box {
      width: 60%;
      height: 36px;
      background: var(--surface);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 7px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tags-scroll-box::-webkit-scrollbar { display: none; }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--g-dim);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--g2);
      border-radius: 99px;
      padding: 2px 8px;
      font-size: 0.74em;
      flex-shrink: 0;
    }

    .tag-chip i {
      cursor: pointer;
      opacity: 0.75;
    }

    .tag-inline-inp {
      background: transparent;
      border: none;
      color: var(--tx);
      font-size: 0.8em;
      outline: none;
      min-width: 65px;
      flex: 1;
    }

    .status-sel {
      flex: 1;
      min-width: 0;
      height: 36px;
      background: var(--surface);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 9px;
      color: var(--tx);
      font-size: 0.78em;
      padding: 0 4px;
      outline: none;
    }

    /* Reader Overlay Modal / View */
    .reader-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 4px 20px;
    }

    #rd {
      white-space: pre-wrap;
      font-family: 'Noto Serif Devanagari', 'Cormorant Garamond', Georgia, serif;
      color: var(--tx);
      line-height: 1.85;
      word-break: break-word;
    }

    /* GitHub-Style Dual Auth Delete Modal */
    #gh-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .gh-box {
      width: 100%;
      max-width: 340px;
      padding: 18px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gh-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--danger);
      font-weight: 600;
      font-size: 0.95em;
    }

    .gh-prompt {
      font-size: 0.83em;
      color: var(--mu);
      line-height: 1.4;
    }

    .gh-target {
      color: var(--tx);
      font-weight: 600;
      user-select: all;
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 5px;
    }

    .gh-btn {
      height: 38px;
      border-radius: 9px;
      border: 1px solid rgba(224, 82, 70, 0.4);
      background: rgba(224, 82, 70, 0.15);
      color: var(--danger);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .gh-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .gh-btn:not(:disabled) {
      background: var(--danger);
      color: #fff;
    }

    /* Loader & Toast */
    #ld {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--g), #fff);
      width: 0;
      transition: width 0.25s;
      z-index: 120;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2);
      color: var(--g);
      border: 1px solid var(--g);
      padding: 8px 16px;
      border-radius: 99px;
      z-index: 110;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      font-size: 0.85em;
    }

    .hide { display: none !important; }
  </style>
</head>

  <script>
    const $ = s => document.querySelector(s);
    const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const LS = {
      g: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
      s: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
    };

    // Common English, Hinglish & Hindi Stopwords/Prepositions for Auto-Tagging
    const STOP_WORDS = new Set([

    // ---- Devanagari / Urdu Matra (Meter) Calculator per line ----
    function calcDevanagariMatra(line) {
      const clean = line.trim();
      if (!clean) return '·';
      // Check if line contains Devanagari script characters
      if (/[\u0900-\u097F]/.test(clean)) {
        let count = 0;
        const chars = Array.from(clean);
        for (let i = 0; i < chars.length; i++) {
          const code = chars[i].charCodeAt(0);
          // Independent vowels
          if (code >= 0x0904 && code <= 0x0914) {
            // Short vowels (अ, इ, उ, ऋ) = 1, Long vowels (आ, ई, ऊ, ए, ऐ, ओ, औ) = 2
            if ([0x0905, 0x0907, 0x0909, 0x090B].includes(code)) count += 1;
            else count += 2;
          }
          // Consonants (क to ह)
          else if (code >= 0x0915 && code <= 0x0939) {
            const next = chars[i + 1] ? chars[i + 1].charCodeAt(0) : 0;
            // Halant / Virama (्) makes consonant half (0 standalone weight)
            if (next === 0x094D) {
              i++; // skip virama
            }
            // Long vowel signs (ा, ी, ू, े, ै, ो, ौ, अनुस्वार ं, विसर्ग ः) = 2
            else if ([0x093E, 0x0940, 0x0942, 0x0947, 0x0948, 0x094B, 0x094C, 0x0902, 0x0903].includes(next)) {
              count += 2;
              i++;
            }
            // Short vowel signs (ि, ु, ृ, चंद्रबिंदु ँ) = 1
            else if ([0x093F, 0x0941, 0x0943, 0x0901].includes(next)) {
              count += 1;
              i++;
            } else {
              count += 1; // Inherent 'a' vowel = 1
            }
          }
        }
        return count || '·';
      }
      // Fallback syllable estimation for Roman Urdu / Hinglish if Hindi/Urdu selected
      const words = clean.split(/\s+/).filter(Boolean);
      let syl = 0;
      words.forEach(w => {
        const m = w.match(/[aeiouy]+/gi);
        syl += m ? m.length : 1;
      });
      return syl || '·';
    }

    // ---- Auto Tag Extractor from Content ----
    function extractSmartTags(content, existingTags = []) {
      const words = String(content || '')
        .replace(/[.,!?;:"'()\[\]{}|\\/<>~`@#$%^&*_+=—–-]+/g, ' ')
        .split(/\s+/)
        .map(w => w.trim().toLowerCase())
        .filter(w => w.length >= 3 && !STOP_WORDS.has(w) && isNaN(w));

      const freq = {};
      words.forEach(w => freq[w] = (freq[w] || 0) + 1);
      const sorted = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
      const combined = [...new Set([...existingTags, ...sorted.slice(0, 6)])];
      return combined.slice(0, 8);
    }

    function jwt(t) {
      try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))) }
      catch { return null }
    }

    // ---- Auth ----
    function showLogin(errMsg = '') {
      $('#app').classList.add('hide');
      $('#login').classList.remove('hide');
      $('#lerr').textContent = errMsg;
    }

    function onCred(r) {
      const p = jwt(r.credential);
      if (!p || String(p.email).toLowerCase() !== CFG.EMAIL.toLowerCase() || !p.email_verified) {
        return showLogin('Unauthorized sanctuary access.');
      }
      TOKEN = r.credential;
      LS.s('tok', TOKEN);
      start();
    }

    function logout() {
      TOKEN = '';
      localStorage.removeItem('tok');
      localStorage.removeItem('pc');
      S.items = [];
      if (window.google?.accounts?.id) google.accounts.id.disableAutoSelect();
      showLogin();
    }

    function initG() {
      if (!window.google || !google.accounts) return setTimeout(initG, 300);
      google.accounts.id.initialize({ client_id: CFG.CLIENT_ID, callback: onCred, auto_select: true });
      google.accounts.id.renderButton($('#gb'), { theme: 'filled_black', size: 'large', text: 'continue_with', shape: 'pill' });
      const p = jwt(TOKEN);
      if (p && p.exp * 1000 > Date.now() + 6e4) start();
      else { showLogin(); google.accounts.id.prompt(); }
    }

    // ---- API Service ----
    async function api(action, data) {
      $('#ld').style.width = '75%';
      try {
        const r = await fetch(CFG.API_URL, {
          method: 'POST',
          redirect: 'follow',
          credentials: 'omit',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ token: TOKEN, action, data })
        });
        const j = await r.json();
        if (!j.ok) {
          if (j.error === 'auth') {
            logout();
            showLogin('Session expired.');
            throw 0;
          }
          throw new Error(j.error);
        }
        return j;
      } catch (e) {
        if (e === 0) throw e;
        throw new Error('Offline');
      } finally {
        $('#ld').style.width = '100%';
        setTimeout(() => $('#ld').style.width = '0', 260);
      }
    }

    const getAllPoetries = async () => { const j = await api('list'); S.items = j.data; LS.s('pc', j.data); };
    const addPoetry = d => api('add', d);
    const updatePoetry = (id, d) => api('update', { ...d, id });
    const deletePoetry = id => api('delete', { id });
    const updateFavorite = (id, value) => api('favorite', { id, value });

    async function start() {
      $('#login').classList.add('hide');
      $('#app').classList.remove('hide');
      S.items = LS.g('pc', []);
      go('poetry');
      try { await getAllPoetries(); }
      catch (e) { if (e) toast('fa-cloud-download', 'Cached', true); }
      R();
    }

    const byId = id => S.items.find(p => p.ID === id);
    const cats = () => [...new Set(['Kavita', 'Poetry', 'Ghazal', 'Nazm', 'Shayari', ...S.items.map(p => p.Category).filter(Boolean)])];

    function filteredList() {
      const f = S.f, q = f.q.toLowerCase();
      let a = S.items.filter(p => {
        const comp = isComplete(p.Status);
        const matchStatus = !f.status || (f.status === 'Complete' ? comp : !comp);
        const matchFav = !f.fav || p.Favorite;
        return (!q || [p.Title, p.Content, p.Category, p.Tags, p.Language].join(' ').toLowerCase().includes(q)) &&
          (!f.cat || p.Category === f.cat) &&
          (!f.lang || p.Language === f.lang) &&
          matchStatus &&
          matchFav;
      });
      const s = {
        new: (x, y) => y.CreatedAt > x.CreatedAt ? 1 : -1,
        old: (x, y) => x.CreatedAt > y.CreatedAt ? 1 : -1,
        az: (x, y) => String(x.Title).localeCompare(String(y.Title))
      };
      return a.sort(s[f.sort] || s.new);
    }

    // ---- VIEW 1: POETRY TAB ----

                <div class="poem-actions">
                  <button class="act-btn" data-edit="${E(p.ID)}" title="Edit"><i class="fa fa-pencil"></i></button>
                  <button class="act-btn del" data-del="${E(p.ID)}" title="Delete"><i class="fa fa-trash-o"></i></button>
                </div>
              </div>`;
          }).join('') || `<div style="text-align:center;margin:auto;color:var(--mu)"><i class="fa fa-book" style="font-size:2em;opacity:0.4"></i></div>`}

    function viewCreate() {
      const d = S.draft;
      const showMeter = d.Language === 'Hindi' || d.Language === 'Urdu';
      const types = ['Kavita', 'Poetry', 'Ghazal', 'Nazm', 'Shayari', 'Geet', 'Free Verse'];
      const langs = ['Hindi', 'English', 'Hinglish'];

      return `
        <div class="create-wrap">
          <!-- First: Content Input Field + Top-Right Font Controls + Right Meter Bar -->
          <div class="editor-container grad-box">
            <div class="font-float">
              <button class="font-btn" id="cr-fdec" type="button">-A</button>
              <button class="font-btn" id="cr-finc" type="button">+A</button>

            <textarea id="eb" style="font-size:${d.fontSize}px" placeholder="उतरने दो काग़ज़ पर रूह के अल्फ़ाज़...">${E(d.Content)}</textarea>
            <div id="meter-col" class="meter-bar ${showMeter ? '' : 'hide'}" title="Matra / Meter Count per line"></div>

          <div class="meta-row-1">

            </select>

          <!-- Row 2 after Input: Tags (60% width horizontal scroll), Status Dropdown, Favorite Toggle -->
          <div class="meta-row-2">
            <div class="tags-scroll-box" id="tag-box">
              ${renderTagChips()}
              <input id="tag-inp" class="tag-inline-inp" placeholder="+tag,">
            </div>
            <select id="es" class="status-sel">
              <option value="Incomplete" ${d.Status === 'Incomplete' ? 'selected' : ''}>Incomplete</option>
              <option value="Completed" ${d.Status === 'Completed' ? 'selected' : ''}>Completed</option>
            </select>
            <button type="button" id="ef-toggle" class="icon-btn ${d.Favorite ? 'on' : ''}">
              <i class="fa ${d.Favorite ? 'fa-star' : 'fa-star-o'}"></i>
            </button>
          </div>
        </div>`;
    }

    function renderTagChips() {
      return S.draft.Tags.map((t, idx) => `
        <span class="tag-chip">
          #${E(t)} <i class="fa fa-times" data-rmtag="${idx}"></i>
        </span>`).join('');
    }

    function refreshTagBox() {
      const box = $('#tag-box');
      if (!box) return;
      const inpVal = $('#tag-inp')?.value || '';
      box.innerHTML = `${renderTagChips()}<input id="tag-inp" class="tag-inline-inp" placeholder="+tag," value="${E(inpVal)}">`;
      bindTagInput();
    }

    function updateMeterBar() {
      const eb = $('#eb');
      const col = $('#meter-col');
      if (!eb || !col) return;
      const show = S.draft.Language === 'Hindi' || S.draft.Language === 'Urdu';
      col.classList.toggle('hide', !show);
      if (!show) return;
      const lines = eb.value.split('\n');
      col.innerHTML = lines.map(l => `<span class="meter-line">${calcDevanagariMatra(l)}</span>`).join('');
      col.scrollTop = eb.scrollTop;
    }

    function bindTagInput() {
      const ti = $('#tag-inp');
      if (!ti) return;
      const commitCommaTags = () => {
        const raw = ti.value;
        if (!raw.trim()) return;
        const parts = raw.split(',').map(x => x.trim().replace(/^#/, '')).filter(Boolean);
        parts.forEach(p => {
          if (!S.draft.Tags.includes(p)) S.draft.Tags.push(p);
        });
        ti.value = '';
        refreshTagBox();
      };
      ti.onblur = commitCommaTags;
      ti.onkeydown = e => {
        if (e.key === ',' || e.key === 'Enter') {
          e.preventDefault();
          commitCommaTags();
          $('#tag-inp')?.focus();
        }
      };
    }

    function bindCreateEvents() {
      const eb = $('#eb');
      if (eb) {
        eb.onscroll = () => {
          const col = $('#meter-col');
          if (col) col.scrollTop = eb.scrollTop;
        };
        eb.oninput = () => {
          S.draft.Content = eb.value;
          updateMeterBar();
        };
        eb.onblur = () => {
          // Auto-fill main words as tags on blur
          if (eb.value.trim()) {
            S.draft.Tags = extractSmartTags(eb.value, S.draft.Tags);
            refreshTagBox();
          }
        };
      }
      bindTagInput();
    }

    function viewRead() {
      const p = byId(S.id);
      if (!p) return `<div style="margin:auto;color:var(--mu)">Not found</div>`;
      const z = LS.g('rs', 20);
      const comp = isComplete(p.Status);
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px;border-bottom:1px solid var(--bd);font-size:0.82em;color:var(--mu)">
          <span>${E(p.Category)} · ${E(p.Language)}</span>
          <span style="color:${comp ? 'var(--ok)' : 'var(--g)'}">
            <i class="fa ${comp ? 'fa-check-circle' : 'fa-clock-o'}"></i> ${comp ? 'Completed' : 'Incomplete'}
          </span>
        </div>
        <div class="reader-scroll">
          <div id="rd" style="font-size:${z}px">${E(p.Content)}</div>
        </div>`;
    }

    // ---- Save & Actions ----
    async function run(fn, icon = 'fa-check', msg = '') {
      if (busy) return false;
      busy = true;
      try {
        await fn();
        await getAllPoetries();
        toast(icon, msg);
        return true;
      } catch (e) {
        if (e) toast('fa-exclamation-circle', 'Error', true);
        return false;
      } finally {
        busy = false;
      }
    }

    async function saveCreation() {
      const d = S.draft;
      d.Title = ($('#et')?.value || '').trim();
      d.Category = $('#ec')?.value || 'Kavita';
      d.Language = $('#el')?.value || 'Hindi';
      d.Content = $('#eb')?.value || '';
      d.Status = $('#es')?.value || 'Incomplete';

      if (!d.Title || !d.Content.trim()) {
        return toast('fa-exclamation', 'Title & verse needed', true);
      }
      // Ensure auto-tags are populated if empty
      if (!d.Tags.length) {
        d.Tags = extractSmartTags(d.Content, []);
      }

      const payload = {
        Title: d.Title,
        Category: d.Category,
        Language: d.Language,
        Content: d.Content,
        Tags: d.Tags.join(', '),
        Status: d.Status === 'Completed' ? 'Complete' : 'Incomplete',
        Favorite: d.Favorite
      };

      const ok = await run(
        () => S.id ? updatePoetry(S.id, payload) : addPoetry(payload),
        'fa-check',
        'Saved'
      );
      if (ok) go('poetry');
    }

    // ---- GitHub Dual-Auth Delete Setup ----
    function openDualAuthDelete(poemId) {
      const p = byId(poemId);
      if (!p) return;
      S.delTarget = p;
      $('#gh-title-lbl').textContent = p.Title;
      const inp = $('#gh-inp');
      const btn = $('#gh-confirm');
      inp.value = '';
      btn.disabled = true;
      $('#gh-modal').classList.remove('hide');
      setTimeout(() => inp.focus(), 60);
    }

    $('#gh-inp').addEventListener('input', e => {
      if (!S.delTarget) return;
      const match = e.target.value.trim() === S.delTarget.Title.trim();
      $('#gh-confirm').disabled = !match;
    });

    $('#gh-close').addEventListener('click', () => {
      $('#gh-modal').classList.add('hide');
      S.delTarget = null;
    });

    $('#gh-confirm').addEventListener('click', async () => {
      if (!S.delTarget) return;
      const id = S.delTarget.ID;
      $('#gh-modal').classList.add('hide');
      S.delTarget = null;
      await run(() => deletePoetry(id), 'fa-trash', 'Deleted');
      R();
    });

    // ---- Global Click & Input Delegation ----
    document.addEventListener('click', async e => {
      // Remove tag chip
      const rmTag = e.target.closest('[data-rmtag]');
      if (rmTag) {
        const idx = Number(rmTag.dataset.rmtag);
        S.draft.Tags.splice(idx, 1);
        refreshTagBox();
        return;
      }

      // Edit button on list or reader
      const editBtn = e.target.closest('[data-edit]');
      if (editBtn) {
        e.stopPropagation();
        const p = byId(editBtn.dataset.edit);
        if (p) {
          loadIntoCreate(p);
          go('create', p.ID);
        }
        return;
      }

      // Delete button on list
      const delBtn = e.target.closest('[data-del]');
      if (delBtn) {
        e.stopPropagation();
        openDualAuthDelete(delBtn.dataset.del);
        return;
      }

      // Read card click
      const readCard = e.target.closest('[data-read]');
      if (readCard) {
        go('read', readCard.dataset.read);
        return;
      }

      // Navigation tabs
      const goBtn = e.target.closest('[data-go]');
      if (goBtn) {
        go(goBtn.dataset.go);
        return;
      }

      // Draft / Published toggle icons in Poetry First Row
      const stBtn = e.target.closest('[data-st]');
      if (stBtn) {
        const val = stBtn.dataset.st;
        S.f.status = S.f.status === val ? '' : val;
        LS.s('flt', S.f);
        R();
        return;
      }

      const btn = e.target.closest('button, i');
      if (!btn) return;
      const id = btn.id;

      if (id === 'sq-cut') {
        S.f.q = '';
        LS.s('flt', S.f);
        R();
        $('#sq')?.focus();
      }
      else if (id === 'open-flt') { S.fp = true; R(); }
      else if (id === 'flt-close') { S.fp = false; R(); }
      else if (id === 'flt-clear') {
        S.f = { q: '', cat: '', lang: '', status: '', fav: '', sort: 'new' };
        LS.s('flt', S.f);
        R();
      }
      else if (id === 'flt-fav') {
        S.f.fav = S.f.fav ? '' : '1';
        LS.s('flt', S.f);
        R();
      }
      else if (id === 'cr-finc' || id === 'cr-fdec') {
        S.draft.fontSize = Math.min(30, Math.max(13, S.draft.fontSize + (id === 'cr-finc' ? 2 : -2)));
        const eb = $('#eb');
        if (eb) eb.style.fontSize = S.draft.fontSize + 'px';
      }
      else if (id === 'ef-toggle') {
        S.draft.Favorite = !S.draft.Favorite;
        btn.classList.toggle('on', S.draft.Favorite);
        btn.innerHTML = `<i class="fa ${S.draft.Favorite ? 'fa-star' : 'fa-star-o'}"></i>`;
      }
      else if (id === 'save-btn') {
        saveCreation();
      }
      else if (id === 'rf-btn') {
        run(() => Promise.resolve(), 'fa-refresh', 'Synced').then(R);
      }
      else if (id === 'rd-inc' || id === 'rd-dec') {
        let z = LS.g('rs', 20);
        z = Math.min(32, Math.max(14, z + (id === 'rd-inc' ? 2 : -2)));
        LS.s('rs', z);
        const rd = $('#rd');
        if (rd) rd.style.fontSize = z + 'px';
      }
      else if (id === 'rd-fav') {
        const p = byId(S.id);
        if (p) {
          await run(() => updateFavorite(p.ID, !p.Favorite), 'fa-star');
          R();
        }
      }
    });

    let searchTimer;
    document.addEventListener('input', e => {
      const t = e.target, id = t.id;
      if (id === 'sq') {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          S.f.q = t.value;
          LS.s('flt', S.f);
          const pos = t.selectionStart;
          R();
          const n = $('#sq');
          if (n) { n.focus(); n.setSelectionRange(pos, pos); }
        }, 180);
      }
      else if (id === 'flt-cat') { S.f.cat = t.value; LS.s('flt', S.f); R(); }
      else if (id === 'flt-lang') { S.f.lang = t.value; LS.s('flt', S.f); R(); }
      else if (id === 'et') S.draft.Title = t.value;
      else if (id === 'ec') S.draft.Category = t.value;
      else if (id === 'el') {
        S.draft.Language = t.value;
        updateMeterBar();
      }
      else if (id === 'es') S.draft.Status = t.value;
    });

    initG();
  </script>
</body>
</html>
